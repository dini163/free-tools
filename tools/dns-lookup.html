<main style="max-width: 900px; margin-top: 2rem;">
    <h1>DNS Lookup</h1>
    <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Query DNS records for any domain. Supports A, AAAA, CNAME, MX, NS, TXT records.</p>

    <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
        <input type="text" class="tool-input" id="domainInput" placeholder="Enter domain (e.g., example.com)" style="flex:1; min-width:250px;">
        <select class="tool-input" id="recordType" style="width:150px;">
            <option value="A">A</option>
            <option value="AAAA">AAAA</option>
            <option value="CNAME">CNAME</option>
            <option value="MX">MX</option>
            <option value="NS">NS</option>
            <option value="TXT">TXT</option>
            <option value="ANY">ANY</option>
        </select>
        <button class="btn btn-primary" onclick="lookupDNS()">Lookup</button>
    </div>

    <div id="result" style="display:none;">
        <h3 style="margin-bottom:1rem;">DNS Records</h3>
        <div class="tool-result" id="dnsResult" style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:1rem; font-family:monospace; white-space:pre-wrap; max-height:400px; overflow-y:auto;">
        </div>
    </div>

    <div id="loading" style="display:none; text-align:center; padding:2rem;">
        <div class="spinner"></div>
        <p style="margin-top:1rem; color:var(--text-secondary);">Querying DNS records...</p>
    </div>

    <div id="error" style="display:none; padding:1rem; background:rgba(239, 68, 68, 0.1); border:1px solid #ef4444; border-radius:var(--radius); margin-top:1rem;">
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 FreeDevTools. This tool uses Google DNS-over-HTTPS API.</p>
</footer>

<script>
async function lookupDNS() {
    const domain = document.getElementById('domainInput').value.trim();
    const type = document.getElementById('recordType').value;
    
    if (!domain) {
        showError('Please enter a domain name.');
        return;
    }

    // Show loading
    document.getElementById('result').style.display = 'none';
    document.getElementById('error').style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    try {
        let url;
        if (type === 'ANY') {
            // Query multiple record types
            const types = ['A', 'AAAA', 'CNAME', 'MX', 'NS', 'TXT'];
            let allResults = '';
            for (const t of types) {
                const result = await queryDNS(domain, t);
                if (result) {
                    allResults += `=== ${t} Records ===\n${result}\n\n`;
                }
            }
            displayResult(allResults || 'No DNS records found.');
        } else {
            const result = await queryDNS(domain, type);
            displayResult(result || 'No DNS records found.');
        }
    } catch (err) {
        showError('Failed to query DNS records: ' + err.message);
    } finally {
        document.getElementById('loading').style.display = 'none';
    }
}

async function queryDNS(domain, type) {
    const response = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=${type}`);
    const data = await response.json();
    
    if (data.Answer && data.Answer.length > 0) {
        return data.Answer.map(record => {
            return `${record.name}\t${record.TTL}\tIN\t${type}\t${record.data}`;
        }).join('\n');
    }
    return null;
}

function displayResult(result) {
    document.getElementById('dnsResult').textContent = result;
    document.getElementById('result').style.display = 'block';
}

function showError(message) {
    const errorDiv = document.getElementById('error');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
}

// Allow Enter key to trigger lookup
document.getElementById('domainInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        lookupDNS();
    }
});
</script>
