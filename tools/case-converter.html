<main style="max-width: 900px; margin-top: 2rem;">
    <h1 class="tool-title" data-i18n="t_case">Case Converter</h1>
    <p class="tool-desc" data-i18n="d_case">Convert text values to UPPER, lower, Title Case, camel, snake, or kebab formats.</p>

    <label class="tool-label">Enter Source Text</label>
    <textarea class="tool-textarea" id="caseInput" placeholder="Paste standard strings here..." style="min-height:120px;"></textarea>
    <div class="btn-group">
        <button class="btn btn-secondary" onclick="changeCase('upper')">UPPERCASE</button>
        <button class="btn btn-secondary" onclick="changeCase('lower')">lowercase</button>
        <button class="btn btn-secondary" onclick="changeCase('title')">Title Case</button>
        <button class="btn btn-secondary" onclick="changeCase('sentence')">Sentence case</button>
        <button class="btn btn-secondary" onclick="changeCase('camel')">camelCase</button>
        <button class="btn btn-secondary" onclick="changeCase('snake')">snake_case</button>
        <button class="btn btn-secondary" onclick="changeCase('kebab')">kebab-case</button>
        <button class="btn btn-secondary copy-btn" onclick="copyText('caseOutput')" data-i18n="btn_copy">Copy Output</button>
    </div>
    <label class="tool-label">Formatted Text Output</label>
    <div class="result-container">
        <div class="tool-output" id="caseOutput" style="min-height:80px;">Output will appear here...</div>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 FreeDevTools. All tools run 100% locally in your web browser — absolutely no data is transmitted to any server.</p>
</footer>

<script>
function changeCase(type) {
    let t = document.getElementById('caseInput').value;
    switch(type) {
        case 'upper': t = t.toUpperCase(); break;
        case 'lower': t = t.toLowerCase(); break;
        case 'title': t = t.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()); break;
        case 'sentence': t = t.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, c => c.toUpperCase()); break;
        case 'camel': t = t.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (_, c) => c.toUpperCase()); break;
        case 'snake': t = t.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, ''); break;
        case 'kebab': t = t.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, ''); break;
    }
    document.getElementById('caseOutput').textContent = t;
}
function copyText(id) {
    const el = document.getElementById(id);
    navigator.clipboard.writeText(el.value || el.textContent).then(() => {
        const btn = document.querySelector('.copy-btn');
        if (btn) {
            const prev = btn.textContent;
            btn.textContent = 'Copied!';
            btn.style.color = 'var(--success)';
            btn.style.borderColor = 'var(--success)';
            setTimeout(() => { btn.textContent = prev; btn.style.color = ''; btn.style.borderColor = ''; }, 1500);
        }
    });
}
</script>
