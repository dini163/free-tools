<script>
// Initialize current timestamp
(function() {
    document.getElementById('currentTs').value = Math.floor(Date.now() / 1000);
    document.getElementById('tsInput').value = Math.floor(Date.now() / 1000);
    convertTimestamp();
})();

function convertTimestamp() {
    let tsVal = document.getElementById('tsInput').value.trim();
    let ts = parseInt(tsVal);
    if (!isNaN(ts) && ts > 0) {
        const isMs = tsVal.length > 11;
        const d = new Date(isMs ? ts : ts * 1000);
        if (isNaN(d.getTime())) {
            document.getElementById('tsDate').textContent = 'Invalid Date';
            return;
        }
        document.getElementById('tsDate').textContent = d.toLocaleString();
        document.getElementById('tsUtc').textContent = d.toUTCString();

        const diff = Date.now() - d.getTime();
        const diffSecs = Math.floor(diff / 1000);
        const diffMins = Math.floor(diffSecs / 60);
        const diffHours = Math.floor(diffMins / 60);
        const diffDays = Math.floor(diffHours / 24);

        let rel = '';
        if (Math.abs(diffSecs) < 10) rel = 'Just now';
        else if (diffSecs > 0) {
            if (diffDays > 0) rel = diffDays + ' days ago';
            else if (diffHours > 0) rel = diffHours + ' hr ago';
            else if (diffMins > 0) rel = diffMins + ' min ago';
            else rel = diffSecs + ' sec ago';
        } else {
            const absMins = Math.abs(diffMins);
            const absHours = Math.abs(diffHours);
            const absDays = Math.abs(diffDays);
            if (absDays > 0) rel = 'In ' + absDays + ' days';
            else if (absHours > 0) rel = 'In ' + absHours + ' hours';
            else if (absMins > 0) rel = 'In ' + absMins + ' minutes';
            else rel = 'In ' + Math.abs(diffSecs) + ' seconds';
        }
        document.getElementById('tsRel').textContent = rel;
    } else {
        document.getElementById('tsDate').textContent = 'Please enter a number';
    }
}
</script>
