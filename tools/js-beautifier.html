<main style="max-width: 900px; margin-top: 2rem;">
    <h1>JS Beautifier</h1>
    <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Beautify and format JavaScript code online.</p>

    <div style="display:grid; gap:1rem; margin-bottom:1.5rem;">
        <div>
            <label style="display:block; margin-bottom:0.3rem; font-weight:500;">Input JS</label>
            <textarea class="tool-textarea" id="jsInput" placeholder="Paste your JavaScript code here..." style="min-height:200px;"></textarea>
        </div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="beautifyJS()">Beautify JS</button>
            <button class="btn btn-secondary" onclick="minifyJS()">Minify JS</button>
            <button class="btn btn-secondary" onclick="clearJS()">Clear</button>
        </div>
        <div>
            <label style="display:block; margin-bottom:0.3rem; font-weight:500;">Output</label>
            <div class="result-container">
                <textarea class="tool-textarea" id="jsOutput" style="min-height:200px;" readonly></textarea>
                <button class="btn btn-secondary copy-btn" onclick="copyJS()" style="margin-top:0.75rem;">Copy Output</button>
            </div>
        </div>

            <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.9rem;">
                <input type="checkbox" id="jsIndentWithTab"> Indent with Tabs
            </label>
            <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.9rem;">
                Indent Size: <input type="number" id="jsIndentSize" value="2" min="1" max="8" style="width:50px; padding:0.3rem; border:1px solid var(--border); border-radius:var(--radius);">
            </label>

<script>
function beautifyJS() {
    const input = document.getElementById('jsInput').value;
    if (!input.trim()) { document.getElementById('jsOutput').value = ''; return; }
    
    const indentChar = document.getElementById('jsIndentWithTab').checked ? '\t' : ' '.repeat(parseInt(document.getElementById('jsIndentSize').value) || 2);
    
    // Simple JS formatter
    let formatted = '';
    let indent = 0;
    const tokens = input.replace(/(\{|\}|\(|\)|\[|\]|;)/g, ' $1 ').split(/\s+/).filter(t => t);
    
    tokens.forEach(token => {
        if (token === '}') indent = Math.max(0, indent - 1);
        formatted += indentChar.repeat(indent) + token + (token === ';' || token === '{' || token === '}' ? '\n' : ' ');
        if (token === '{') indent++;
    });
    
    document.getElementById('jsOutput').value = formatted.trim();
}

function minifyJS() {
    const input = document.getElementById('jsInput').value;
    if (!input.trim()) { document.getElementById('jsOutput').value = ''; return; }
    
    const minified = input
        .replace(/\/\/[^\n]*/g, '') // Remove single-line comments
        .replace(/\/\*[\s\S]*?\*\//g, '') // Remove multi-line comments
        .replace(/\s+/g, ' ') // Collapse whitespace
        .replace(/\s*([{}()[\];,])\s*/g, '$1') // Remove spaces around punctuation
        .replace(/;\}/g, '}') // Remove semicolon before closing brace
        .trim();
    
    document.getElementById('jsOutput').value = minified;
}

function clearJS() {
    document.getElementById('jsInput').value = '';
    document.getElementById('jsOutput').value = '';
}

function copyJS() {
    const output = document.getElementById('jsOutput');
    output.select();
    navigator.clipboard.writeText(output.value).then(() => {
        const btn = document.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy Output'; }, 1500); }
    });
}
</script>
