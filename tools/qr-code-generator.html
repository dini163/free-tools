<main style="max-width: 900px; margin-top: 2rem;">
    <h1 class="tool-title" data-i18n="qr_title">QR Code Generator</h1>
    <p class="tool-desc" data-i18n="qr_desc">Generate QR codes for URLs, text, or contact info instantly. Customizable size and colors.</p>
    
    <div class="tool-row" style="align-items: stretch;">
        <!-- Left configuration side -->
        <div class="tool-col" style="flex: 1.4; min-width: 300px;">
            <label class="tool-label" data-i18n="qr_enter">Text or URL</label>
            <textarea class="tool-textarea" id="qrText" placeholder="Enter text or URL to encode..." style="min-height: 120px; margin-bottom: 1rem;">https://example.com</textarea>
            
            <div class="tool-row">
                <div class="tool-col">
                    <label class="tool-label" data-i18n="qr_size">Size</label>
                    <select class="tool-select" id="qrSize">
                        <option value="150">Small (150px)</option>
                        <option value="250" selected>Medium (250px)</option>
                        <option value="400">Large (400px)</option>
                        <option value="600">Extra Large (600px)</option>
                    </select>
                </div>
                <div class="tool-col">
                    <label class="tool-label">Format</label>
                    <select class="tool-select" id="qrFormat">
                        <option value="png" selected>PNG</option>
                        <option value="jpg">JPG</option>
                        <option value="svg">SVG</option>
                    </select>
                </div>
            </div>
            
            <div class="tool-row" style="margin-top: 1rem;">
                <div class="tool-col">
                    <label class="tool-label" data-i18n="qr_fg">FG Color</label>
                    <input type="color" id="qrColor" value="#fafafa" style="width: 100%; height: 38px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: transparent; padding: 2px;">
                </div>
                <div class="tool-col">
                    <label class="tool-label" data-i18n="qr_bg">BG Color</label>
                    <input type="color" id="qrBgColor" value="#09090b" style="width: 100%; height: 38px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: transparent; padding: 2px;">
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="generateQr()" style="width: 100%; margin-top: 1.5rem; height: 46px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.5rem;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><rect x="7" y="7" width="3" height="3"></rect><rect x="14" y="7" width="3" height="3"></rect><rect x="7" y="14" width="3" height="3"></rect><rect x="14" y="14" width="3" height="3"></rect></svg>

            <label class="tool-label" style="align-self: flex-start; margin-bottom: 1rem;"><span data-i18n="qr_preview">Preview</span></label>

<script>
    function generateQr() {
        const text = encodeURIComponent(document.getElementById('qrText').value.trim() || 'https://example.com');
        const size = document.getElementById('qrSize').value;
        const format = document.getElementById('qrFormat').value;
        const color = document.getElementById('qrColor').value.slice(1);
        const bgcolor = document.getElementById('qrBgColor').value.slice(1);
        
        const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${text}&color=${color}&bgcolor=${bgcolor}&format=${format}`;
        
        const img = document.createElement('img');
        img.src = apiUrl;
        img.alt = 'QR Code';
        img.id = 'qrCodeImg';
        img.style.maxWidth = '100%';
        img.style.height = 'auto';
        img.style.borderRadius = '8px';
        img.style.border = '4px solid var(--border)';
        img.style.boxShadow = 'var(--shadow)';
        
        const resultContainer = document.getElementById('qrResult');
        resultContainer.innerHTML = '';
        resultContainer.appendChild(img);
        
        document.getElementById('dlBtn').style.display = 'inline-flex';
    }

    function downloadQr() {
        const img = document.getElementById('qrCodeImg');
        if (!img) return;
        
        const format = document.getElementById('qrFormat').value;
        const size = document.getElementById('qrSize').value;
        
        // Fetch the image as a blob and download it to prevent blank tab opens
        fetch(img.src)
            .then(response => response.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `qrcode-${size}x${size}.${format}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            })
            .catch(() => {
                // Fallback to direct tab opening
                window.open(img.src, '_blank');
            });
    }

    // Auto-generate on load to populate the preview container
    window.addEventListener('DOMContentLoaded', () => {
        generateQr();
    });
</script>
