    <style>
    
:root {
  --bg: var(--bg-primary);
  --surface: var(--bg-card);
  --border: var(--border);
  --text: var(--text-primary);
  --text2: var(--text-secondary);
  --text3: var(--text-muted);
  --primary: var(--accent-light);
  --primary-light: var(--accent-glow);
  --primary-bg: var(--accent-glow);
  --primary-dark: var(--accent);
  --success: var(--success);
  --warning: var(--warning);
  --yellow: var(--warning);
  --red: var(--error);
  --danger: var(--error);
  --shadow: var(--shadow);
  --radius: var(--radius);
  --radius-sm: var(--radius-sm);
  --todo: rgba(99, 102, 241, 0.1);
  --progress: rgba(245, 158, 11, 0.1);
  --done: rgba(16, 185, 129, 0.1);
  --white-key: #ffffff;
  --black-key: #09090b;
}
.theme-light {
  --primary: var(--accent);
  --primary-dark: var(--accent-dark);
  --primary-light: rgba(99, 102, 241, 0.08);
  --primary-bg: rgba(99, 102, 241, 0.08);
  --todo: #eff6ff;
  --progress: #fef9c3;
  --done: #dcfce7;
  --white-key: #f4f4f5;
  --black-key: #27272a;
}
*{box-sizing:border-box;margin:0;padding:0}
.tool-body-style {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:16px;color:var(--primary);display:flex;align-items:center;gap:8px}
.logo span{background:var(--primary);color:#fff;font-size:10px;padding:2px 8px;border-radius:3px;text-transform:uppercase}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{background:#f3f4f6}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#0550ae}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{color:var(--danger);border-color:var(--danger)}.btn-danger:hover{background:#fff1f0}
nav{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface);padding:0 20px}
.nav-tab{padding:10px 16px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
main{padding:16px 20px;max-width:1400px;margin:0 auto}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;min-height:400px}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.column{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);display:flex;flex-direction:column;min-height:300px}
.column-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.column-header h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.column-header .count{background:var(--border);padding:1px 8px;border-radius:10px;font-size:11px;color:var(--text2)}
.column-.tool-body-style {padding:8px;flex:1;display:flex;flex-direction:column;gap:6px;min-height:80px;transition:background .2s}
.column-body.drag-over{background:var(--primary-light)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;cursor:grab;transition:all .15s;box-shadow:var(--shadow)}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.5;transform:rotate(2deg)}
.card-title{font-size:13px;font-weight:600;margin-bottom:4px}
.card-meta{display:flex;gap:12px;font-size:11px;color:var(--text2)}
.card-tag{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600}
.tag-feature{background:#ddf4ff;color:#0969da}
.tag-bug{background:#ffebe9;color:#cf222e}
.tag-chore{background:#dafbe1;color:#1a7f37}
.tag-refactor{background:#fff8c5;color:#9a6700}
.empty-drop{padding:20px;text-align:center;color:var(--text3);font-size:13px;border:2px dashed var(--border);border-radius:var(--radius-sm)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;min-width:420px;max-width:500px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.modal h3{font-size:16px;margin-bottom:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--surface);color:var(--text)}
.form-group textarea{resize:vertical;min-height:60px}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat-card .label{font-size:11px;text-transform:uppercase;color:var(--text3);letter-spacing:.3px}
.stat-card .value{font-size:26px;font-weight:700;margin:4px 0}
.stat-card .sub{font-size:11px;color:var(--text2)}
.chart-area{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.chart-area h3{font-size:14px;margin-bottom:8px}
.timer-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--warning);color:#fff;border-radius:var(--radius-sm);font-size:13px;font-weight:600;margin-bottom:8px}
.timer-bar.running{background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.85}}
.timer-bar button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:11px}
.sprint-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sprint-header .sprint-name{font-size:18px;font-weight:700}
.sprint-header .sprint-date{font-size:13px;color:var(--text2)}
input[type=date]{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit}

    </style>
</head>

<div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); border-bottom:1px solid var(--border); padding:0 20px; flex-wrap:wrap; gap:10px;"><nav style="border-bottom:none; padding:0;">

<main id="tab-board">

<script>

const COLUMNS = ['todo','in-progress','done'];
const COL_LABELS = { 'todo':'To Do', 'in-progress':'In Progress', 'done':'Done' };

let sprints = JSON.parse(localStorage.getItem('sb_sprints') || '[]');
let currentSprintId = localStorage.getItem('sb_currentSprint');
let cards = JSON.parse(localStorage.getItem('sb_cards') || '[]');
let timerCardId = null;
let timerInterval = null;
let timerSeconds = 0;
let editingCardId = null;

function save() {
  localStorage.setItem('sb_sprints', JSON.stringify(sprints));
  localStorage.setItem('sb_cards', JSON.stringify(cards));
  localStorage.setItem('sb_currentSprint', currentSprintId || '');
}

function getCurrentSprint() {
  return sprints.find(s => s.id === currentSprintId);
}

function getSprintCards() {
  return cards.filter(c => c.sprintId === currentSprintId);
}

function ensureSprint() {
  if (!getCurrentSprint()) {
    const s = {
      id: 'sprint_' + Date.now(),
      name: 'Sprint ' + (sprints.length + 1),
      startDate: new Date().toISOString().split('T')[0],
      endDate: new Date(Date.now() + 14*86400000).toISOString().split('T')[0]
    };
    sprints.push(s);
    currentSprintId = s.id;
    save();
  }
}

// Board rendering
function renderBoard() {
  ensureSprint();
  const sprint = getCurrentSprint();
  document.getElementById('sprintName').textContent = sprint.name;
  document.getElementById('sprintDate').textContent = `${sprint.startDate} → ${sprint.endDate}`;

  const sprintCards = getSprintCards();
  COLUMNS.forEach(col => {
    const body = document.getElementById('col-' + col);
    const colCards = sprintCards.filter(c => c.status === col);
    document.getElementById('count-' + col).textContent = colCards.length;

    if (!colCards.length) {
      body.innerHTML = `<div class="empty-drop">Drop tasks here</div>`;
      return;
    }
    body.innerHTML = colCards.map(c => {
      const tagClass = 'tag-' + c.type;
      const timeSpent = c.timeSpent || 0;
      const timeStr = timeSpent > 0 ? `${Math.floor(timeSpent/60)}h ${timeSpent%60}m` : '';
      const isTracking = timerCardId === c.id;
      return `<div class="card${isTracking?' tracking':''}" draggable="true" data-id="${c.id}"
        ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)"
        ondblclick="openCardModal('${c.id}')">
        <div class="card-title">${escapeHtml(c.title)}</div>
        <div class="card-meta">
          <span class="card-tag ${tagClass}">${c.type}</span>
          <span>🎯 ${c.points || 0} pts</span>
          ${timeStr ? `<span>⏱ ${timeStr}</span>` : ''}
        </div>
        <div style="margin-top:6px;display:flex;gap:4px">
          ${!isTracking ? `<button class="btn btn-sm" onclick="event.stopPropagation();startTimer('${c.id}')" title="Start timer">▶</button>` :
            `<button class="btn btn-sm" style="background:var(--success);color:#fff" onclick="event.stopPropagation();stopTimer()" title="Stop timer">⏹</button>`}
          <button class="btn btn-sm" onclick="event.stopPropagation();openCardModal('${c.id}')" title="Edit">✎</button>
        </div>
      </div>`;
    }).join('');
  });
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Drag & Drop
let draggedCardId = null;
function handleDragStart(e) {
  draggedCardId = e.target.closest('.card').dataset.id;
  e.target.closest('.card').classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function handleDragEnd(e) {
  e.target.closest('.card').classList.remove('dragging');
  draggedCardId = null;
  document.querySelectorAll('.column-body').forEach(b => b.classList.remove('drag-over'));
}
function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function handleDrop(e, status) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!draggedCardId) return;
  const card = cards.find(c => c.id === draggedCardId);
  if (!card) return;
  const oldStatus = card.status;
  card.status = status;
  if (status === 'done' && !card.completedAt) card.completedAt = new Date().toISOString();
  if (status !== 'done') card.completedAt = null;
  save();
  renderBoard();
}

// Card modal
function openCardModal(id) {
  editingCardId = id || null;
  const modal = document.getElementById('cardModal');
  const titleEl = document.getElementById('modalTitle');
  const btnDel = document.getElementById('btnDelete');

  if (id) {
    const card = cards.find(c => c.id === id);
    if (!card) return;
    titleEl.textContent = 'Edit Card';
    document.getElementById('cardTitle').value = card.title;
    document.getElementById('cardDesc').value = card.desc || '';
    document.getElementById('cardType').value = card.type;
    document.getElementById('cardPoints').value = card.points || 3;
    btnDel.style.display = '';
  } else {
    titleEl.textContent = 'Add Card';
    document.getElementById('cardTitle').value = '';
    document.getElementById('cardDesc').value = '';
    document.getElementById('cardType').value = 'feature';
    document.getElementById('cardPoints').value = 3;
    btnDel.style.display = 'none';
  }
  modal.style.display = 'flex';
  document.getElementById('cardTitle').focus();
}

function closeModal() {
  document.getElementById('cardModal').style.display = 'none';
  editingCardId = null;
}

function saveCard() {
  const title = document.getElementById('cardTitle').value.trim();
  if (!title) return;
  ensureSprint();

  if (editingCardId) {
    const card = cards.find(c => c.id === editingCardId);
    if (card) {
      card.title = title;
      card.desc = document.getElementById('cardDesc').value;
      card.type = document.getElementById('cardType').value;
      card.points = parseInt(document.getElementById('cardPoints').value) || 3;
    }
  } else {
    cards.push({
      id: 'card_' + Date.now(),
      sprintId: currentSprintId,
      title, desc: document.getElementById('cardDesc').value,
      type: document.getElementById('cardType').value,
      points: parseInt(document.getElementById('cardPoints').value) || 3,
      status: 'todo', timeSpent: 0, createdAt: new Date().toISOString(),
      completedAt: null
    });
  }
  save();
  closeModal();
  renderBoard();
}

function deleteCard() {
  if (!editingCardId) return;
  if (!confirm('Delete this card?')) return;
  if (timerCardId === editingCardId) stopTimer();
  cards = cards.filter(c => c.id !== editingCardId);
  save();
  closeModal();
  renderBoard();
}

document.getElementById('cardModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Timer
function startTimer(cardId) {
  if (timerCardId) stopTimer();
  timerCardId = cardId;
  timerSeconds = 0;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimerDisplay();
    // Persist every 30s
    if (timerSeconds % 30 === 0) persistTimer();
  }, 1000);
  renderBoard();
}

function stopTimer() {
  if (!timerCardId) return;
  clearInterval(timerInterval);
  persistTimer();
  timerCardId = null;
  timerSeconds = 0;
  updateTimerDisplay();
  renderBoard();
}

function persistTimer() {
  if (!timerCardId) return;
  const card = cards.find(c => c.id === timerCardId);
  if (card) {
    card.timeSpent = (card.timeSpent || 0) + Math.floor(timerSeconds / 60);
    save();
  }
  timerSeconds = 0;
}

function updateTimerDisplay() {
  const el = document.getElementById('activeTimer');
  if (timerCardId) {
    const card = cards.find(c => c.id === timerCardId);
    const m = Math.floor(timerSeconds/60), s = timerSeconds%60;
    el.style.display = '';
    el.innerHTML = `<span class="timer-bar running">⏱ Tracking: ${card?card.title:'...'} — ${m}:${String(s).padStart(2,'0')} <button onclick="stopTimer()">Stop</button></span>`;
  } else {
    el.style.display = 'none';
  }
}

// Sprint management
function startNewSprint() {
  if (getSprintCards().some(c => c.status !== 'done')) {
    if (!confirm('Current sprint has unfinished tasks. Archive and start new sprint?')) return;
  }
  const s = {
    id: 'sprint_' + Date.now(),
    name: 'Sprint ' + (sprints.length + 1),
    startDate: new Date().toISOString().split('T')[0],
    endDate: new Date(Date.now() + 14*86400000).toISOString().split('T')[0]
  };
  sprints.push(s);
  currentSprintId = s.id;
  save();
  renderBoard();
  renderAll();
}

function editSprint() {
  const sprint = getCurrentSprint();
  if (!sprint) return;
  const name = prompt('Sprint name:', sprint.name);
  if (name) sprint.name = name;
  const start = prompt('Start date (YYYY-MM-DD):', sprint.startDate);
  if (start) sprint.startDate = start;
  const end = prompt('End date (YYYY-MM-DD):', sprint.endDate);
  if (end) sprint.endDate = end;
  save();
  renderBoard();
}

// Analytics
function renderAnalytics() {
  const sprintCards = getSprintCards();
  const sprint = getCurrentSprint();

  const total = sprintCards.length;
  const done = sprintCards.filter(c => c.status === 'done').length;
  const inProgress = sprintCards.filter(c => c.status === 'in-progress').length;
  const totalPoints = sprintCards.reduce((s,c) => s + (c.points||0), 0);
  const donePoints = sprintCards.filter(c => c.status === 'done').reduce((s,c) => s + (c.points||0), 0);
  const totalTime = sprintCards.reduce((s,c) => s + (c.timeSpent||0), 0);

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="label">Tasks</div><div class="value">${done}/${total}</div><div class="sub">${total?Math.round(done/total*100):0}% complete</div></div>
    <div class="stat-card"><div class="label">Story Points</div><div class="value">${donePoints}/${totalPoints}</div><div class="sub">${totalPoints?Math.round(donePoints/totalPoints*100):0}% burned</div></div>
    <div class="stat-card"><div class="label">Time Tracked</div><div class="value">${Math.floor(totalTime/60)}h ${totalTime%60}m</div><div class="sub">Across ${total} tasks</div></div>
    <div class="stat-card"><div class="label">In Progress</div><div class="value">${inProgress}</div><div class="sub">Tasks currently active</div></div>
  `;

  // Burndown
  if (sprint && sprintCards.length) {
    const start = new Date(sprint.startDate);
    const end = new Date(sprint.endDate);
    const days = [];
    const ideal = [];
    const actual = [];
    const totalDays = Math.max(1, Math.ceil((end - start) / 86400000));
    let remaining = totalPoints;
    for (let d = 0; d <= totalDays; d++) {
      const date = new Date(start.getTime() + d * 86400000);
      days.push(date.toLocaleDateString('en-US', {month:'short',day:'numeric'}));
      ideal.push(totalPoints * (1 - d / totalDays));
      const completedBefore = sprintCards.filter(c =>
        c.status === 'done' && c.completedAt && new Date(c.completedAt) <= date
      ).reduce((s,c) => s + (c.points||0), 0);
      actual.push(totalPoints - completedBefore);
    }
    Plotly.newPlot('burndownChart', [
      {x:days, y:ideal, type:'scatter', mode:'lines', name:'Ideal', line:{dash:'dash',color:'#8b949e',width:2}},
      {x:days, y:actual, type:'scatter', mode:'lines+markers', name:'Actual', line:{color:'#0969da',width:3}, marker:{size:6}}
    ], {
      xaxis:{title:'Date'}, yaxis:{title:'Story Points Remaining'},
      template:'plotly_white', margin:{t:20,r:20,b:50,l:50},
      legend:{x:0,y:1.1,orientation:'h'}
    }, {responsive:true});
  }

  // Distribution pie
  const types = {};
  sprintCards.forEach(c => { types[c.type] = (types[c.type]||0)+1; });
  Plotly.newPlot('distChart', [{
    labels: Object.keys(types).map(t => t.charAt(0).toUpperCase()+t.slice(1)),
    values: Object.values(types),
    type:'pie', hole:.4,
    marker:{colors:['#0969da','#cf222e','#1a7f37','#9a6700']}
  }], {
    template:'plotly_white', margin:{t:20,r:20,b:20,l:20}
  }, {responsive:true});
}

function renderSprints() {
  const list = document.getElementById('sprintsList');
  if (!sprints.length) {
    list.innerHTML = '<div class="card" style="text-align:center;padding:40px;color:var(--text2)">No sprints yet. Start your first sprint!</div>';
    return;
  }
  list.innerHTML = sprints.map(s => {
    const sc = cards.filter(c => c.sprintId === s.id);
    const done = sc.filter(c => c.status === 'done').length;
    return `<div class="card" style="cursor:pointer;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"
      onclick="loadSprint('${s.id}')">
      <div>
        <div style="font-weight:600;font-size:14px">${s.name} ${s.id===currentSprintId?'<span style="color:var(--primary);font-size:11px">(active)</span>':''}</div>
        <div style="font-size:12px;color:var(--text2)">${s.startDate} → ${s.endDate} · ${sc.length} tasks · ${done} done</div>
      </div>
      ${s.id !== currentSprintId ? `<button class="btn btn-sm" onclick="event.stopPropagation();loadSprint('${s.id}')">Load</button>` : ''}
    </div>`;
  }).join('');
}

function loadSprint(id) {
  currentSprintId = id;
  save();
  renderAll();
  switchTab('board');
}

function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('tab-board').style.display = tab === 'board' ? '' : 'none';
  document.getElementById('tab-analytics').style.display = tab === 'analytics' ? '' : 'none';
  document.getElementById('tab-history').style.display = tab === 'history' ? '' : 'none';
  if (tab === 'analytics') renderAnalytics();
  if (tab === 'history') renderSprints();
}

function renderAll() {
  renderBoard();
  if (document.getElementById('tab-analytics').style.display !== 'none') renderAnalytics();
}

// Init
ensureSprint();
renderAll();

// Periodic save for timer
setInterval(() => { if (timerCardId) persistTimer(); }, 30000);

</script>
</body>
</html>
