<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Generator - Free Tools</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../i18n.css">
    <link rel="stylesheet" href="../theme.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">
            <span class="logo-icon">📳</span>
            <span class="logo-text">Free Tools</span>
        </div>
        <nav>
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="../index.html#tools" data-i18n="nav_tools">Tools</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switch">
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('zh')">中文</button>
            </div>
            <div class="theme-switch">
                <button onclick="setTheme('light')">☀️</button>
                <button onclick="setTheme('dark')">🌙</button>
                <button onclick="setTheme('auto')">🔄</button>
            </div>
        </div>
    </header>
    <main>
        <section class="tool-hero">
            <h1>Barcode Generator</h1>
            <p>Generate various types of barcodes (CODE128, EAN, UPC, etc.).</p>
        </section>
        <section class="tool-container">
            <div class="barcode-input">
                <label>Text/Number:</label>
                <input type="text" id="barcodeText" placeholder="Enter text or number" oninput="generateBarcode()">
            </div>
            <div class="barcode-type">
                <label>Barcode Type:</label>
                <select id="barcodeType" onchange="generateBarcode()">
                    <option value="CODE128">CODE128</option>
                    <option value="EAN13">EAN13</option>
                    <option value="EAN8">EAN8</option>
                    <option value="UPC">UPC</option>
                    <option value="CODE39">CODE39</option>
                    <option value="ITF14">ITF14</option>
                    <option value="MSI">MSI</option>
                    <option value="PHARMACODE">PHARMACODE</option>
                </select>
            </div>
            <div class="barcode-options">
                <label>Options:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="barcodeShowText" checked onchange="generateBarcode()"> Show Text</label>
                    <label><input type="checkbox" id="barcodeFlat" onchange="generateBarcode()"> Flat</label>
                </div>
            </div>
            <div class="barcode-output" id="barcodeOutput">
                <svg id="barcodeSVG"></svg>
            </div>
            <div class="barcode-actions">
                <button class="btn" onclick="downloadBarcode()">Download SVG</button>
                <button class="btn btn-secondary" onclick="downloadBarcodePNG()">Download PNG</button>
            </div>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">Free Tools - All tools are free and open source.</p>
    </footer>
    <script src="../i18n.js"></script>
    <script src="../theme.js"></script>
    <script>
        function generateBarcode() {
            const text = document.getElementById('barcodeText').value;
            const type = document.getElementById('barcodeType').value;
            const showText = document.getElementById('barcodeShowText').checked;
            const flat = document.getElementById('barcodeFlat').checked;
            
            if (!text) {
                document.getElementById('barcodeOutput').style.display = 'none';
                return;
            }
            
            try {
                JsBarcode("#barcodeSVG", text, {
                    format: type,
                    displayValue: showText,
                    flat: flat,
                    lineColor: document.body.classList.contains('dark-theme') ? '#ffffff' : '#000000',
                    background: document.body.classList.contains('dark-theme') ? '#1a1a2e' : '#ffffff'
                });
                document.getElementById('barcodeOutput').style.display = 'block';
            } catch (e) {
                console.error('Barcode generation error:', e);
                document.getElementById('barcodeOutput').style.display = 'none';
            }
        }

        function downloadBarcode() {
            const svg = document.getElementById('barcodeSVG');
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svg);
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'barcode.svg';
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadBarcodePNG() {
            const svg = document.getElementById('barcodeSVG');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            const svgString = new XMLSerializer().serializeToString(svg);
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const pngUrl = canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = pngUrl;
                a.download = 'barcode.png';
                a.click();
                URL.revokeObjectURL(url);
            };
            
            img.src = url;
        }
    </script>
</body>
</html>
