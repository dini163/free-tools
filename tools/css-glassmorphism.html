<main style="max-width: 900px; margin-top: 2rem;">
    <h1 class="tool-title" data-i18n="t_glass">CSS Glassmorphism Lab</h1>
    <p class="tool-desc" data-i18n="d_glass">Design modern frosted-glass effects visually and copy optimized CSS code.</p>

    <div class="tool-row">
        <div class="tool-col" style="flex: 1;">
            <label class="tool-label">Background Image URL (optional)</label>
            <input type="text" class="tool-input" id="glassBg" placeholder="https://... or leave empty for solid bg" oninput="updateGlassPreview()">
        </div>
    </div>

    <div class="tool-row" style="margin-top:1rem;">
        <div class="tool-col">
            <label class="tool-label">Blur Radius: <span id="glassBlurVal">10</span>px</label>
            <input type="range" min="0" max="30" value="10" class="tool-range" id="glassBlur" oninput="updateGlassPreview()">
        </div>
        <div class="tool-col">
            <label class="tool-label">Background Opacity: <span id="glassOpacityVal">0.25</span></label>
            <input type="range" min="0.05" max="0.5" step="0.05" value="0.25" class="tool-range" id="glassOpacity" oninput="updateGlassPreview()">
        </div>
    </div>

    <div class="tool-row" style="margin-top:1rem;">
        <div class="tool-col">
            <label class="tool-label">Border Radius: <span id="glassRadiusVal">16</span>px</label>
            <input type="range" min="0" max="32" value="16" class="tool-range" id="glassRadius" oninput="updateGlassPreview()">
        </div>
        <div class="tool-col">
            <label class="tool-label">Border Opacity: <span id="glassBorderVal">0.3</span></label>
            <input type="range" min="0" max="1" step="0.05" value="0.3" class="tool-range" id="glassBorder" oninput="updateGlassPreview()">
        </div>
    </div>

    <!-- Preview Area -->
    <div id="glassPreviewBox" style="position:relative; width:100%; height:220px; border-radius:var(--radius-lg); overflow:hidden; margin:1.25rem 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div id="glassPreviewCard" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); padding:1.5rem 2rem; min-width:200px; text-align:center; color:white; font-weight:600; font-size:1.1rem;">
            Glass Card Preview
        </div>
    </div>

    <label class="tool-label">Generated CSS Code</label>
    <div class="result-container">
        <div class="tool-output" id="glassCssOutput" style="min-height:80px; white-space:pre-wrap; font-family:var(--font-mono); font-size:0.85rem;"></div>
        <button class="btn btn-secondary copy-btn" onclick="copyText('glassCssOutput')" data-i18n="btn_copy">Copy CSS</button>
    </div>

<script>
function updateGlassPreview() {
    const blur = document.getElementById('glassBlur').value;
    const opacity = document.getElementById('glassOpacity').value;
    const radius = document.getElementById('glassRadius').value;
    const border = document.getElementById('glassBorder').value;

    document.getElementById('glassBlurVal').textContent = blur;
    document.getElementById('glassOpacityVal').textContent = parseFloat(opacity).toFixed(2);
    document.getElementById('glassRadiusVal').textContent = radius;
    document.getElementById('glassBorderVal').textContent = parseFloat(border).toFixed(2);

    const card = document.getElementById('glassPreviewCard');
    card.style.borderRadius = radius + 'px';
    card.style.background = 'rgba(255,255,255,' + opacity + ')';
    card.style.backdropFilter = 'blur(' + blur + 'px)';
    card.style.webkitBackdropFilter = 'blur(' + blur + 'px)';
    card.style.border = '1px solid rgba(255,255,255,' + border + ')';
    card.style.boxShadow = '0 8px 32px rgba(0,0,0,0.2)';

    const bgUrl = document.getElementById('glassBg').value.trim();
    const box = document.getElementById('glassPreviewBox');
    if (bgUrl) {
        box.style.background = 'url("' + bgUrl + '") center/cover no-repeat';
    } else {
        box.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
    }

    const css = '.glass-card {\n' +
        '    background: rgba(255, 255, 255, ' + parseFloat(opacity).toFixed(2) + ');\n' +
        '    backdrop-filter: blur(' + blur + 'px);\n' +
        '    -webkit-backdrop-filter: blur(' + blur + 'px);\n' +
        '    border-radius: ' + radius + 'px;\n' +
        '    border: 1px solid rgba(255, 255, 255, ' + parseFloat(border).toFixed(2) + ');\n' +
        '    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);\n' +
        '}';
    document.getElementById('glassCssOutput').textContent = css;
}

function copyText(id) {
    const el = document.getElementById(id);
    navigator.clipboard.writeText(el.textContent).then(() => {
        const btn = document.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy CSS'; }, 1500); }
    });
}

// Init
updateGlassPreview();
</script>
