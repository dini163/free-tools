<main style="max-width: 900px; margin-top: 2rem;">
    <h1 class="tool-title" data-i18n="t_csv">CSV to JSON Converter</h1>
    <p class="tool-desc" data-i18n="d_csv">Instantly map tabular CSV text structures into standard nested JSON arrays.</p>

    <div class="tool-row">
        <div class="tool-col">
            <label class="tool-label">CSV Source String</label>
            <textarea class="tool-textarea" id="csvInput" placeholder="name,age,city\nJohn,30,NYC\nJane,25,LA" style="min-height:180px;"></textarea>
        </div>
        <div class="tool-col">
            <label class="tool-label">JSON Output / Result</label>
            <div class="result-container">
                <textarea class="tool-textarea" id="csvJsonOutput" style="min-height:180px;" readonly>Output array...</textarea>
                <button class="btn btn-secondary copy-btn" onclick="copyText('csvJsonOutput')" data-i18n="btn_copy">Copy Output</button>
            </div>
        </div>
    </div>
    <div class="btn-group">
        <button class="btn btn-primary" onclick="csvToJson()">Convert CSV to JSON</button>
        <button class="btn btn-secondary" onclick="jsonToCsv()">Convert JSON to CSV</button>
    </div>

<script>
function csvToJson() {
    try {
        const input = document.getElementById('csvInput').value.trim();
        if (!input) { document.getElementById('csvJsonOutput').value = 'Input is empty'; return; }
        const lines = input.split('\n');
        const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
        const result = lines.slice(1).map(line => {
            const vals = line.split(',').map(v => v.trim().replace(/^["']|["']$/g, ''));
            return headers.reduce((obj, h, i) => { obj[h] = vals[i] || ''; return obj; }, {});
        });
        document.getElementById('csvJsonOutput').value = JSON.stringify(result, null, 2);
    } catch(e) { document.getElementById('csvJsonOutput').value = 'Parsing Error: ' + e.message; }
}
function jsonToCsv() {
    try {
        const input = document.getElementById('csvInput').value.trim();
        if (!input) { document.getElementById('csvJsonOutput').value = 'Input is empty'; return; }
        const data = JSON.parse(input);
        if (!Array.isArray(data) || data.length === 0) { document.getElementById('csvJsonOutput').value = 'Error: Expected an array of JSON objects'; return; }
        const headers = Object.keys(data[0]);
        let csv = headers.join(',') + '\n';
        data.forEach(row => { csv += headers.map(h => '"' + (row[h] !== undefined ? row[h] : '').toString().replace(/"/g, '""') + '"').join(',') + '\n'; });
        document.getElementById('csvJsonOutput').value = csv;
    } catch(e) { document.getElementById('csvJsonOutput').value = 'Processing Error: ' + e.message; }
}
function copyText(id) {
    const el = document.getElementById(id);
    navigator.clipboard.writeText(el.value).then(() => {
        const btn = document.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy Output'; }, 1500); }
    });
}
</script>
