<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placeholder Image Generator - Free Tools</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../i18n.css">
    <link rel="stylesheet" href="../theme.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">
            <span class="logo-icon">🖼️</span>
            <span class="logo-text">Free Tools</span>
        </div>
        <nav>
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="../index.html#tools" data-i18n="nav_tools">Tools</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switch">
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('zh')">中文</button>
            </div>
            <div class="theme-switch">
                <button onclick="setTheme('light')">☀️</button>
                <button onclick="setTheme('dark')">🌙</button>
                <button onclick="setTheme('auto')">🔄</button>
            </div>
        </div>
    </header>
    <main>
        <section class="tool-hero">
            <h1>Placeholder Image Generator</h1>
            <p>Generate custom placeholder images with text, colors, and sizes.</p>
        </section>
        <section class="tool-container">
            <div class="placeholder-options">
                <div class="input-group">
                    <label>Width:</label>
                    <input type="number" id="phWidth" value="640" min="10" max="2000" oninput="generatePlaceholder()">
                </div>
                <div class="input-group">
                    <label>Height:</label>
                    <input type="number" id="phHeight" value="480" min="10" max="2000" oninput="generatePlaceholder()">
                </div>
                <div class="input-group">
                    <label>Background Color:</label>
                    <input type="color" id="phBgColor" value="#cccccc" oninput="generatePlaceholder()">
                </div>
                <div class="input-group">
                    <label>Text Color:</label>
                    <input type="color" id="phTextColor" value="#666666" oninput="generatePlaceholder()">
                </div>
                <div class="input-group">
                    <label>Text:</label>
                    <input type="text" id="phText" placeholder="Placeholder" oninput="generatePlaceholder()">
                </div>
                <div class="input-group">
                    <label>Font Size:</label>
                    <input type="number" id="phFontSize" value="24" min="8" max="72" oninput="generatePlaceholder()">
                </div>
            </div>
            <div class="placeholder-preview" id="placeholderPreview">
                <canvas id="placeholderCanvas"></canvas>
            </div>
            <div class="placeholder-actions">
                <button class="btn" onclick="downloadPlaceholder()">Download PNG</button>
                <button class="btn btn-secondary" onclick="copyPlaceholderURL()">Copy URL</button>
            </div>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">Free Tools - All tools are free and open source.</p>
    </footer>
    <script src="../i18n.js"></script>
    <script src="../theme.js"></script>
    <script>
        function generatePlaceholder() {
            const width = parseInt(document.getElementById('phWidth').value) || 640;
            const height = parseInt(document.getElementById('phHeight').value) || 480;
            const bgColor = document.getElementById('phBgColor').value;
            const textColor = document.getElementById('phTextColor').value;
            const text = document.getElementById('phText').value || `${width}x${height}`;
            const fontSize = parseInt(document.getElementById('phFontSize').value) || 24;
            
            const canvas = document.getElementById('placeholderCanvas');
            canvas.width = width;
            canvas.height = height;
            
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, width, height);
            
            // Border
            ctx.strokeStyle = textColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, width, height);
            
            // Text
            ctx.fillStyle = textColor;
            ctx.font = `${fontSize}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, width / 2, height / 2);
        }
        
        function downloadPlaceholder() {
            const canvas = document.getElementById('placeholderCanvas');
            const url = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = url;
            a.download = `placeholder-${canvas.width}x${canvas.height}.png`;
            a.click();
        }
        
        function copyPlaceholderURL() {
            const canvas = document.getElementById('placeholderCanvas');
            canvas.toBlob(blob => {
                const item = new ClipboardItem({ 'image/png': blob });
                navigator.clipboard.write([item]).then(() => {
                    alert('Image copied to clipboard!');
                });
            });
        }
        
        // Initialize
        generatePlaceholder();
    </script>
</body>
</html>
