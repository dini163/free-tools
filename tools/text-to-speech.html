<main style="max-width: 900px; margin-top: 2rem;">
    <h1 class="tool-title" data-i18n="t_tts">Text to Speech Reader</h1>
    <p class="tool-desc" data-i18n="d_tts">Listen to text read aloud natively using configurable browser vocal synthesizers.</p>

    <label class="tool-label">Enter Text to Read</label>
    <textarea class="tool-textarea" id="ttsInput" placeholder="Paste article text, paragraphs, or any string to vocalize..." style="min-height:140px;"></textarea>

    <div class="tool-row" style="margin: 1.25rem 0;">
        <div class="tool-col">
            <label class="tool-label">Voice Select</label>
            <select class="tool-select" id="ttsVoice" onchange="updateTtsSettings()"></select>
        </div>
        <div class="tool-col">
            <label class="tool-label">Speech Rate: <span id="ttsRateVal">1.0</span></label>
            <input type="range" min="0.5" max="2" step="0.1" value="1" class="tool-range" id="ttsRate" oninput="updateTtsSettings()">
        </div>
        <div class="tool-col">
            <label class="tool-label">Pitch: <span id="ttsPitchVal">1.0</span></label>
            <input type="range" min="0.5" max="2" step="0.1" value="1" class="tool-range" id="ttsPitch" oninput="updateTtsSettings()">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="speakTts()" id="ttsSpeakBtn">🔊 Speak</button>
        <button class="btn btn-secondary" onclick="pauseTts()" id="ttsPauseBtn">⏸ Pause</button>
        <button class="btn btn-secondary" onclick="stopTts()">⏹ Stop</button>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 FreeDevTools. All tools run 100% locally in your web browser — absolutely no data is transmitted to any server.</p>
</footer>

<script>
let ttsVoices = [];
function loadTtsVoices() {
    ttsVoices = speechSynthesis.getVoices();
    const sel = document.getElementById('ttsVoice');
    sel.innerHTML = '';
    ttsVoices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = v.name + ' (' + v.lang + ')';
        sel.appendChild(opt);
    });
}
speechSynthesis.onvoiceschanged = loadTtsVoices;
loadTtsVoices();

function speakTts() {
    if (!document.getElementById('ttsInput').value.trim()) return;
    stopTts();
    const utter = new SpeechSynthesisUtterance(document.getElementById('ttsInput').value);
    const idx = parseInt(document.getElementById('ttsVoice').value) || 0;
    utter.voice = ttsVoices[idx];
    utter.rate = parseFloat(document.getElementById('ttsRate').value);
    utter.pitch = parseFloat(document.getElementById('ttsPitch').value);
    speechSynthesis.speak(utter);
    document.getElementById('ttsSpeakBtn').textContent = '🔊 Speaking...';
    utter.onend = () => { document.getElementById('ttsSpeakBtn').textContent = '🔊 Speak'; };
}
function pauseTts() {
    if (speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.pause();
    else if (speechSynthesis.paused) speechSynthesis.resume();
}
function stopTts() { speechSynthesis.cancel(); document.getElementById('ttsSpeakBtn').textContent = '🔊 Speak'; }
function updateTtsSettings() {
    document.getElementById('ttsRateVal').textContent = document.getElementById('ttsRate').value;
    document.getElementById('ttsPitchVal').textContent = document.getElementById('ttsPitch').value;
}
</script>
