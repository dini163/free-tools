<main style="max-width: 900px; margin-top: 2rem;">
    <h1>Color Converter</h1>

                <input type="text" class="tool-input" id="colorInput" placeholder="#ff0000 or rgb(255,0,0)" style="flex:1;">
                <input type="color" id="colorPicker" value="#ff0000" style="width:50px; height:40px; border:none; padding:0; cursor:pointer;">

        <div id="colorPreview" style="height:80px; border-radius:var(--radius); border:1px solid var(--border); margin-bottom:1rem;"></div>

<script>
document.getElementById('colorInput').addEventListener('input', function() {
    convertColor(this.value);
});
document.getElementById('colorPicker').addEventListener('input', function() {
    document.getElementById('colorInput').value = this.value;
    convertColor(this.value);
});

function convertColor(input) {
    let r, g, b;
    
    // Parse input
    if (input.match(/^#?([0-9A-Fa-f]{3}){1,2}$/)) {
        const hex = input.replace('#', '');
        r = parseInt(hex.substring(0,2), 16);
        g = parseInt(hex.substring(2,4), 16);
        b = parseInt(hex.substring(4,6), 16);
    } else if (input.match(/rgb\s*\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\)/i)) {
        const match = input.match(/\d+/g);
        r = parseInt(match[0]);
        g = parseInt(match[1]);
        b = parseInt(match[2]);
    } else {
        return;
    }
    
    // Update color picker
    const hex = `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;
    document.getElementById('colorPicker').value = hex.toLowerCase();
    document.getElementById('colorPreview').style.background = hex;
    
    // HEX
    document.getElementById('colorHex').value = hex;
    
    // RGB
    document.getElementById('colorRgb').value = `rgb(${r}, ${g}, ${b})`;
    
    // HSL
    const hsl = rgbToHsl(r, g, b);
    document.getElementById('colorHsl').value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
    
    // CMYK
    const cmyk = rgbToCmyk(r, g, b);
    document.getElementById('colorCmyk').value = `cmyk(${cmyk.c}%, ${cmyk.m}%, ${cmyk.y}%, ${cmyk.k}%)`;
}

function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    
    if (max === min) {
        h = s = 0;
    } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
        }
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
}

function rgbToCmyk(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const k = 1 - Math.max(r, g, b);
    if (k === 1) return { c: 0, m: 0, y: 0, k: 100 };
    const c = (1 - r - k) / (1 - k);
    const m = (1 - g - k) / (1 - k);
    const y = (1 - b - k) / (1 - k);
    return { c: Math.round(c * 100), m: Math.round(m * 100), y: Math.round(y * 100), k: Math.round(k * 100) };
}

function copyColor(id) {
    const el = document.getElementById(id);
    el.select();
    navigator.clipboard.writeText(el.value).then(() => {
        const btn = el.parentElement.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy'; }, 1500); }
    });
}

// Initialize
convertColor('#ff0000');
</script>
