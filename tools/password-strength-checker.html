<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker - Free Tools</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../i18n.css">
    <link rel="stylesheet" href="../theme.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">
            <span class="logo-icon">🔒</span>
            <span class="logo-text">Free Tools</span>
        </div>
        <nav>
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="../index.html#tools" data-i18n="nav_tools">Tools</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switch">
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('zh')">中文</button>
            </div>
            <div class="theme-switch">
                <button onclick="setTheme('light')">☀️</button>
                <button onclick="setTheme('dark')">🌙</button>
                <button onclick="setTheme('auto')">🔄</button>
            </div>
        </div>
    </header>
    <main>
        <section class="tool-hero">
            <h1 data-i18n="pwd_title">Password Strength Checker</h1>
            <p data-i18n="pwd_desc">Check the strength of your password and get improvement suggestions.</p>
        </section>
        <section class="tool-container">
            <div class="pwd-input">
                <input type="password" id="pwdInput" placeholder="Enter password..." oninput="checkPasswordStrength()">
                <button class="pwd-toggle" onclick="togglePasswordVisibility()">👁️</button>
            </div>
            <div class="pwd-strength-bar">
                <div class="pwd-strength-fill" id="pwdStrengthFill"></div>
            </div>
            <div class="pwd-strength-text" id="pwdStrengthText"></div>
            <div class="pwd-requirements">
                <h3 data-i18n="pwd_req">Requirements:</h3>
                <ul>
                    <li id="pwdLength" class="pwd-req-item">At least 8 characters</li>
                    <li id="pwdLowercase" class="pwd-req-item">Lowercase letter</li>
                    <li id="pwdUppercase" class="pwd-req-item">Uppercase letter</li>
                    <li id="pwdNumber" class="pwd-req-item">Number</li>
                    <li id="pwdSpecial" class="pwd-req-item">Special character</li>
                </ul>
            </div>
            <div class="pwd-suggestions" id="pwdSuggestions"></div>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">Free Tools - All tools are free and open source.</p>
    </footer>
    <script src="../i18n.js"></script>
    <script src="../theme.js"></script>
    <script>
        function checkPasswordStrength() {
            const password = document.getElementById('pwdInput').value;
            const requirements = {
                length: password.length >= 8,
                lowercase: /[a-z]/.test(password),
                uppercase: /[A-Z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)
            };

            // Update requirement indicators
            updateRequirement('pwdLength', requirements.length);
            updateRequirement('pwdLowercase', requirements.lowercase);
            updateRequirement('pwdUppercase', requirements.uppercase);
            updateRequirement('pwdNumber', requirements.number);
            updateRequirement('pwdSpecial', requirements.special);

            // Calculate strength
            let strength = 0;
            let suggestions = [];

            if (password.length === 0) {
                updateStrengthBar(0, '');
                return;
            }

            if (requirements.length) strength++;
            else suggestions.push('Use at least 8 characters');

            if (requirements.lowercase) strength++;
            else suggestions.push('Add lowercase letters');

            if (requirements.uppercase) strength++;
            else suggestions.push('Add uppercase letters');

            if (requirements.number) strength++;
            else suggestions.push('Add numbers');

            if (requirements.special) strength++;
            else suggestions.push('Add special characters');

            // Check for common patterns
            if (/(.)\1\1/.test(password)) {
                strength = Math.max(0, strength - 1);
                suggestions.push('Avoid repeated characters');
            }

            if (/^(123|abc|qwerty)/i.test(password)) {
                strength = Math.max(0, strength - 1);
                suggestions.push('Avoid common sequences');
            }

            // Update strength bar
            const strengthText = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'];
            const strengthColor = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#15803d'];
            
            updateStrengthBar(strength, strengthText[strength]);
            document.getElementById('pwdStrengthFill').style.backgroundColor = strengthColor[strength];
            document.getElementById('pwdStrengthText').style.color = strengthColor[strength];

            // Show suggestions
            const suggestionsDiv = document.getElementById('pwdSuggestions');
            if (suggestions.length > 0 && strength < 4) {
                suggestionsDiv.innerHTML = '<h4>Suggestions:</h4><ul><li>' + suggestions.join('</li><li>') + '</li></ul>';
            } else {
                suggestionsDiv.innerHTML = '';
            }
        }

        function updateRequirement(id, met) {
            const element = document.getElementById(id);
            if (met) {
                element.classList.add('pwd-req-met');
                element.classList.remove('pwd-req-unmet');
            } else {
                element.classList.add('pwd-req-unmet');
                element.classList.remove('pwd-req-met');
            }
        }

        function updateStrengthBar(strength, text) {
            const percentage = (strength / 4) * 100;
            document.getElementById('pwdStrengthFill').style.width = percentage + '%';
            document.getElementById('pwdStrengthText').textContent = text;
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('pwdInput');
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
    </script>
</body>
</html>
