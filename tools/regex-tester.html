<main style="max-width: 900px; margin-top: 2rem;">
    <h1 class="tool-title" data-i18n="t_regex">Regex Tester</h1>
    <p class="tool-desc" data-i18n="d_regex">Test standard regular expression patterns with real-time text matching.</p>

    <div class="tool-row">
        <div class="tool-col" style="flex: 2;">
            <label class="tool-label">Regular Expression Pattern</label>
            <input type="text" class="tool-input" id="regexPattern" placeholder="e.g. \b[A-Za-z]+\b" oninput="testRegex()">
        </div>
        <div class="tool-col">
            <label class="tool-label">Regex Flags</label>
            <input type="text" class="tool-input" id="regexFlags" value="gi" oninput="testRegex()">
        </div>
    </div>
    <label class="tool-label">Test Subject Text</label>
    <textarea class="tool-textarea" id="regexInput" placeholder="Enter paragraph text to evaluate matches..." oninput="testRegex()" style="min-height:120px;"></textarea>
    <label class="tool-label">Matching Analytics</label>
    <div class="tool-output" id="regexOutput" style="min-height:60px;white-space:pre-wrap;">Enter regular expression to begin matches...</div>
</main>

<footer class="footer">
    <p>&copy; 2026 FreeDevTools. All tools run 100% locally in your web browser — absolutely no data is transmitted to any server.</p>
</footer>

<script>
function testRegex() {
    try {
        const pattern = document.getElementById('regexPattern').value;
        const flags = document.getElementById('regexFlags').value;
        const text = document.getElementById('regexInput').value;
        if (!pattern || !text) { document.getElementById('regexOutput').textContent = 'Awaiting values...'; return; }
        const regex = new RegExp(pattern, flags);
        const matches = [...text.matchAll(regex)];
        if (matches.length) {
            let html = '<span style="color:var(--success);font-weight:600;">Found ' + matches.length + ' matching entry(s):</span>\n';
            matches.forEach((m, i) => { html += (i+1) + '. "' + escapeHtml(m[0]) + '" (index ' + m.index + ')\n'; });
            document.getElementById('regexOutput').innerHTML = html;
        } else {
            document.getElementById('regexOutput').textContent = 'No matches resolved.';
        }
    } catch(e) { document.getElementById('regexOutput').innerHTML = '<span style="color:var(--error)">Regex Error: ' + escapeHtml(e.message) + '</span>'; }
}
function escapeHtml(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
</script>
