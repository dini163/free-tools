<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Calculator - Free Tools</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../i18n.css">
    <link rel="stylesheet" href="../theme.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">
            <span class="logo-icon">📅</span>
            <span class="logo-text">Free Tools</span>
        </div>
        <nav>
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="../index.html#tools" data-i18n="nav_tools">Tools</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switch">
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('zh')">中文</button>
            </div>
            <div class="theme-switch">
                <button onclick="setTheme('light')">☀️</button>
                <button onclick="setTheme('dark')">🌙</button>
                <button onclick="setTheme('auto')">🔄</button>
            </div>
        </div>
    </header>
    <main>
        <section class="tool-hero">
            <h1 data-i18n="date_title">Date Calculator</h1>
            <p data-i18n="date_desc">Calculate days between dates, or add/subtract days from a date.</p>
        </section>
        <section class="tool-container">
            <div class="date-modes">
                <button class="date-mode-btn active" onclick="switchDateMode('difference')" data-i18n="date_diff">Date Difference</button>
                <button class="date-mode-btn" onclick="switchDateMode('add')" data-i18n="date_add">Add/Subtract Days</button>
            </div>

            <!-- Date Difference -->
            <div id="dateDifference" class="date-section">
                <div class="date-inputs">
                    <div class="date-input-group">
                        <label data-i18n="date_start">Start Date:</label>
                        <input type="date" id="startDate" onchange="calculateDateDifference()">
                    </div>
                    <div class="date-input-group">
                        <label data-i18n="date_end">End Date:</label>
                        <input type="date" id="endDate" onchange="calculateDateDifference()">
                    </div>
                </div>
                <div class="date-result" id="dateDiffResult"></div>
            </div>

            <!-- Add/Subtract Days -->
            <div id="dateAdd" class="date-section" style="display:none;">
                <div class="date-inputs">
                    <div class="date-input-group">
                        <label data-i18n="date_start">Start Date:</label>
                        <input type="date" id="addStartDate" onchange="calculateAddDays()">
                    </div>
                    <div class="date-input-group">
                        <label data-i18n="date_days">Days (+/-):</label>
                        <input type="number" id="daysToAdd" value="0" oninput="calculateAddDays()">
                    </div>
                </div>
                <div class="date-result" id="dateAddResult"></div>
            </div>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">Free Tools - All tools are free and open source.</p>
    </footer>
    <script src="../i18n.js"></script>
    <script src="../theme.js"></script>
    <script>
        function switchDateMode(mode) {
            document.querySelectorAll('.date-mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('dateDifference').style.display = mode === 'difference' ? 'block' : 'none';
            document.getElementById('dateAdd').style.display = mode === 'add' ? 'block' : 'none';
        }

        function calculateDateDifference() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            
            if (isNaN(start.getTime()) || isNaN(end.getTime())) {
                document.getElementById('dateDiffResult').innerHTML = '';
                return;
            }
            
            const timeDiff = Math.abs(end.getTime() - start.getTime());
            const daysDiff = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
            
            const years = Math.floor(daysDiff / 365);
            const months = Math.floor((daysDiff % 365) / 30);
            const days = daysDiff % 365 % 30;
            
            let result = `<h3>${daysDiff} days</h3>`;
            if (years > 0 || months > 0) {
                result += `<p>≈ ${years} years, ${months} months, ${days} days</p>`;
            }
            
            document.getElementById('dateDiffResult').innerHTML = result;
        }

        function calculateAddDays() {
            const start = new Date(document.getElementById('addStartDate').value);
            const days = parseInt(document.getElementById('daysToAdd').value) || 0;
            
            if (isNaN(start.getTime())) {
                document.getElementById('dateAddResult').innerHTML = '';
                return;
            }
            
            const result = new Date(start);
            result.setDate(result.getDate() + days);
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateAddResult').innerHTML = `<h3>${result.toLocaleDateString('en-US', options)}</h3>`;
        }
        
        // Set default dates
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;
        document.getElementById('addStartDate').value = today;
    </script>
</body>
</html>
