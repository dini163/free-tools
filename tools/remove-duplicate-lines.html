<main style="max-width: 900px; margin-top: 2rem;">
    <h1>Remove Duplicate Lines</h1>
    <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Remove duplicate lines from your text.</p>

    <div style="display:grid; gap:1rem; margin-bottom:1.5rem;">
        <div>
            <label style="display:block; margin-bottom:0.3rem; font-weight:500;">Input Text</label>
            <textarea class="tool-textarea" id="dupInput" placeholder="Paste your text here..." style="min-height:200px;" oninput="updateDuplicateCount()"></textarea>
        </div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="removeDuplicates()">Remove Duplicates</button>
            <button class="btn btn-secondary" onclick="keepOnlyDuplicates()">Keep Only Duplicates</button>
            <button class="btn btn-secondary" onclick="clearDuplicateText()">Clear</button>
        </div>
        <div>
            <label style="display:block; margin-bottom:0.3rem; font-weight:500;">Output (Unique Lines)</label>
            <div class="result-container">
                <textarea class="tool-textarea" id="dupOutput" style="min-height:200px;" readonly></textarea>
                <button class="btn btn-secondary copy-btn" onclick="copyDuplicateResult()" style="margin-top:0.75rem;">Copy Output</button>
            </div>
        </div>
        <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
            <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.9rem;">
                <input type="checkbox" id="dupCaseSensitive"> Case sensitive
            </label>
            <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.9rem;">
                <input type="checkbox" id="dupTrimSpaces"> Trim spaces
            </label>
            <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.9rem;">
                <input type="checkbox" id="dupRemoveEmpty"> Remove empty lines
            </label>
        </div>
        <div id="dupStats" style="padding:0.75rem; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); font-size:0.85rem; color:var(--text-secondary);">
            Lines: 0 → 0 (removed 0 duplicates)
        </div>
    </div>
</main>

<script>
function removeDuplicates() {
    const input = document.getElementById('dupInput').value;
    if (!input.trim()) { document.getElementById('dupOutput').value = ''; return; }
    
    const lines = input.split('\n');
    const caseSensitive = document.getElementById('dupCaseSensitive').checked;
    const trimSpaces = document.getElementById('dupTrimSpaces').checked;
    const removeEmpty = document.getElementById('dupRemoveEmpty').checked;
    
    const seen = new Set();
    const unique = [];
    
    lines.forEach(line => {
        let processed = line;
        if (trimSpaces) processed = processed.trim();
        if (removeEmpty && !processed) return;
        
        const key = caseSensitive ? processed : processed.toLowerCase();
        if (!seen.has(key)) {
            seen.add(key);
            unique.push(line);
        }
    });
    
    document.getElementById('dupOutput').value = unique.join('\n');
    updateDuplicateStats(lines.length, unique.length, lines.length - unique.length);
}

function keepOnlyDuplicates() {
    const input = document.getElementById('dupInput').value;
    if (!input.trim()) { document.getElementById('dupOutput').value = ''; return; }
    
    const lines = input.split('\n');
    const caseSensitive = document.getElementById('dupCaseSensitive').checked;
    const trimSpaces = document.getElementById('dupTrimSpaces').checked;
    
    const count = {};
    lines.forEach(line => {
        let processed = line;
        if (trimSpaces) processed = processed.trim();
        const key = caseSensitive ? processed : processed.toLowerCase();
        count[key] = (count[key] || 0) + 1;
    });
    
    const duplicates = lines.filter(line => {
        let processed = line;
        if (trimSpaces) processed = processed.trim();
        const key = caseSensitive ? processed : processed.toLowerCase();
        return count[key] > 1;
    });
    
    document.getElementById('dupOutput').value = duplicates.join('\n');
    updateDuplicateStats(lines.length, duplicates.length, 0);
}

function updateDuplicateCount() {
    const input = document.getElementById('dupInput').value;
    const lines = input.split('\n');
    document.getElementById('dupStats').textContent = `Lines: ${lines.length} total`;
}

function updateDuplicateStats(original, final, removed) {
    document.getElementById('dupStats').textContent = `Lines: ${original} → ${final} (removed ${removed} duplicates)`;
}

function clearDuplicateText() {
    document.getElementById('dupInput').value = '';
    document.getElementById('dupOutput').value = '';
    document.getElementById('dupStats').textContent = 'Lines: 0 → 0 (removed 0 duplicates)';
}

function copyDuplicateResult() {
    const output = document.getElementById('dupOutput');
    output.select();
    navigator.clipboard.writeText(output.value).then(() => {
        const btn = document.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy Output'; }, 1500); }
    });
}

// Initialize
updateDuplicateCount();
</script>
