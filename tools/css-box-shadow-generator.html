<main>
        <section class="tool-hero">
            <h1>CSS Box Shadow Generator</h1>
            <p>Generate CSS box-shadow with visual preview.</p>
        </section>
        <section class="tool-container">
            <div class="box-shadow-preview" id="boxShadowPreview"></div>
            <div class="box-shadow-controls">
                <div class="control-group">
                    <label>Horizontal Offset:</label>
                    <input type="range" id="bsHOffset" min="-50" max="50" value="0" oninput="updateBoxShadow()">
                    <span id="bsHOffsetVal">0px</span>
                </div>
                <div class="control-group">
                    <label>Vertical Offset:</label>
                    <input type="range" id="bsVOffset" min="-50" max="50" value="4" oninput="updateBoxShadow()">
                    <span id="bsVOffsetVal">4px</span>
                </div>
                <div class="control-group">
                    <label>Blur Radius:</label>
                    <input type="range" id="bsBlur" min="0" max="100" value="16" oninput="updateBoxShadow()">
                    <span id="bsBlurVal">16px</span>
                </div>
                <div class="control-group">
                    <label>Spread Radius:</label>
                    <input type="range" id="bsSpread" min="-50" max="50" value="0" oninput="updateBoxShadow()">
                    <span id="bsSpreadVal">0px</span>
                </div>
                <div class="control-group">
                    <label>Color:</label>
                    <input type="color" id="bsColor" value="#000000" oninput="updateBoxShadow()">
                </div>
                <div class="control-group">
                    <label>Opacity:</label>
                    <input type="range" id="bsOpacity" min="0" max="100" value="25" oninput="updateBoxShadow()">
                    <span id="bsOpacityVal">0.25</span>
                </div>
                <div class="control-group">
                    <label><input type="checkbox" id="bsInset" onchange="updateBoxShadow()"> Inset</label>
                </div>
                <button class="btn" onclick="copyBoxShadow()">Copy CSS</button>
            </div>
            <div class="box-shadow-output">
                <textarea id="bsOutput" readonly rows="3"></textarea>
            </div>
        </section>
