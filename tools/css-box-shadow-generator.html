<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Shadow Generator - Free Tools</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../i18n.css">
    <link rel="stylesheet" href="../theme.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">
            <span class="logo-icon">📦</span>
            <span class="logo-text">Free Tools</span>
        </div>
        <nav>
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="../index.html#tools" data-i18n="nav_tools">Tools</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switch">
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('zh')">中文</button>
            </div>
            <div class="theme-switch">
                <button onclick="setTheme('light')">☀️</button>
                <button onclick="setTheme('dark')">🌙</button>
                <button onclick="setTheme('auto')">🔄</button>
            </div>
        </div>
    </header>
    <main>
        <section class="tool-hero">
            <h1>CSS Box Shadow Generator</h1>
            <p>Generate CSS box-shadow with visual preview.</p>
        </section>
        <section class="tool-container">
            <div class="box-shadow-preview" id="boxShadowPreview"></div>
            <div class="box-shadow-controls">
                <div class="control-group">
                    <label>Horizontal Offset:</label>
                    <input type="range" id="bsHOffset" min="-50" max="50" value="0" oninput="updateBoxShadow()">
                    <span id="bsHOffsetVal">0px</span>
                </div>
                <div class="control-group">
                    <label>Vertical Offset:</label>
                    <input type="range" id="bsVOffset" min="-50" max="50" value="4" oninput="updateBoxShadow()">
                    <span id="bsVOffsetVal">4px</span>
                </div>
                <div class="control-group">
                    <label>Blur Radius:</label>
                    <input type="range" id="bsBlur" min="0" max="100" value="16" oninput="updateBoxShadow()">
                    <span id="bsBlurVal">16px</span>
                </div>
                <div class="control-group">
                    <label>Spread Radius:</label>
                    <input type="range" id="bsSpread" min="-50" max="50" value="0" oninput="updateBoxShadow()">
                    <span id="bsSpreadVal">0px</span>
                </div>
                <div class="control-group">
                    <label>Color:</label>
                    <input type="color" id="bsColor" value="#000000" oninput="updateBoxShadow()">
                </div>
                <div class="control-group">
                    <label>Opacity:</label>
                    <input type="range" id="bsOpacity" min="0" max="100" value="25" oninput="updateBoxShadow()">
                    <span id="bsOpacityVal">0.25</span>
                </div>
                <div class="control-group">
                    <label><input type="checkbox" id="bsInset" onchange="updateBoxShadow()"> Inset</label>
                </div>
                <button class="btn" onclick="copyBoxShadow()">Copy CSS</button>
            </div>
            <div class="box-shadow-output">
                <textarea id="bsOutput" readonly rows="3"></textarea>
            </div>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">Free Tools - All tools are free and open source.</p>
    </footer>
    <script src="../i18n.js"></script>
    <script src="../theme.js"></script>
    <script>
        function updateBoxShadow() {
            const hOffset = document.getElementById('bsHOffset').value;
            const vOffset = document.getElementById('bsVOffset').value;
            const blur = document.getElementById('bsBlur').value;
            const spread = document.getElementById('bsSpread').value;
            const color = document.getElementById('bsColor').value;
            const opacity = parseInt(document.getElementById('bsOpacity').value) / 100;
            const inset = document.getElementById('bsInset').checked ? 'inset ' : '';

            // Update labels
            document.getElementById('bsHOffsetVal').textContent = hOffset + 'px';
            document.getElementById('bsVOffsetVal').textContent = vOffset + 'px';
            document.getElementById('bsBlurVal').textContent = blur + 'px';
            document.getElementById('bsSpreadVal').textContent = spread + 'px';
            document.getElementById('bsOpacityVal').textContent = (opacity).toFixed(2);

            // Convert hex to rgba
            const r = parseInt(color.slice(1, 3), 16);
            const g = parseInt(color.slice(3, 5), 16);
            const b = parseInt(color.slice(5, 7), 16);
            const rgba = `rgba(${r}, ${g}, ${b}, ${opacity})`;

            const shadow = `${inset}${hOffset}px ${vOffset}px ${blur}px ${spread}px ${rgba}`;
            document.getElementById('boxShadowPreview').style.boxShadow = shadow;
            document.getElementById('bsOutput').value = `box-shadow: ${shadow};`;
        }

        function copyBoxShadow() {
            const output = document.getElementById('bsOutput');
            output.select();
            document.execCommand('copy');
            alert('CSS copied to clipboard!');
        }

        // Initialize
        updateBoxShadow();
    </script>
</body>
</html>
