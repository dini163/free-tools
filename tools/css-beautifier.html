<main style="max-width: 900px; margin-top: 2rem;">
    <h1>CSS Beautifier</h1>
    <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Beautify and format CSS code online.</p>

    <div style="display:grid; gap:1rem; margin-bottom:1.5rem;">
        <div>
            <label style="display:block; margin-bottom:0.3rem; font-weight:500;">Input CSS</label>
            <textarea class="tool-textarea" id="cssInput" placeholder="Paste your CSS code here..." style="min-height:200px;"></textarea>
        </div>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="beautifyCSS()">Beautify CSS</button>
            <button class="btn btn-secondary" onclick="minifyCSS()">Minify CSS</button>
            <button class="btn btn-secondary" onclick="clearCSS()">Clear</button>
        </div>
        <div>
            <label style="display:block; margin-bottom:0.3rem; font-weight:500;">Output</label>
            <div class="result-container">
                <textarea class="tool-textarea" id="cssOutput" style="min-height:200px;" readonly></textarea>
                <button class="btn btn-secondary copy-btn" onclick="copyCSS()" style="margin-top:0.75rem;">Copy Output</button>
            </div>
        </div>
        <div style="display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
            <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.9rem;">
                <input type="checkbox" id="cssIndentWithTab"> Indent with Tabs
            </label>
            <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.9rem;">
                Indent Size: <input type="number" id="cssIndentSize" value="2" min="1" max="8" style="width:50px; padding:0.3rem; border:1px solid var(--border); border-radius:var(--radius);">
            </label>
        </div>
    </div>
</main>

</footer>

<script>
function beautifyCSS() {
    const input = document.getElementById('cssInput').value;
    if (!input.trim()) { document.getElementById('cssOutput').value = ''; return; }
    
    const indentChar = document.getElementById('cssIndentWithTab').checked ? '\t' : ' '.repeat(parseInt(document.getElementById('cssIndentSize').value) || 2);
    
    // Simple CSS formatter
    let formatted = '';
    let indent = 0;
    const cleaned = input.replace(/\s+/g, ' ').trim();
    
    for (let i = 0; i < cleaned.length; i++) {
        const char = cleaned[i];
        const nextChar = cleaned[i + 1] || '';
        
        if (char === '}') {
            indent = Math.max(0, indent - 1);
            formatted = formatted.trimEnd() + '\n' + indentChar.repeat(indent) + '}\n';
        } else if (char === '{') {
            formatted = formatted.trimEnd() + ' {\n';
            indent++;
        } else if (char === ';' && nextChar !== '}') {
            formatted += ';\n' + indentChar.repeat(indent);
            i++;
        } else {
            formatted += char;
        }
    }
    
    document.getElementById('cssOutput').value = formatted.trim();
}

function minifyCSS() {
    const input = document.getElementById('cssInput').value;
    if (!input.trim()) { document.getElementById('cssOutput').value = ''; return; }
    
    const minified = input
        .replace(/\/\*[\s\S]*?\*\//g, '') // Remove comments
        .replace(/\s+/g, ' ')
        .replace(/\s*{\s*/g, '{')
        .replace(/\s*}\s*/g, '}')
        .replace(/\s*;\s*/g, ';')
        .replace(/\s*:\s*/g, ':')
        .replace(/\s*,\s*/g, ',')
        .trim();
    
    document.getElementById('cssOutput').value = minified;
}

function clearCSS() {
    document.getElementById('cssInput').value = '';
    document.getElementById('cssOutput').value = '';
}

function copyCSS() {
    const output = document.getElementById('cssOutput');
    output.select();
    navigator.clipboard.writeText(output.value).then(() => {
        const btn = document.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy Output'; }, 1500); }
    });
}
</script>
