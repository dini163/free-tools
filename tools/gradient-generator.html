<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Generator - Free Tools</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../i18n.css">
    <link rel="stylesheet" href="../theme.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">
            <span class="logo-icon">🎨</span>
            <span class="logo-text">Free Tools</span>
        </div>
        <nav>
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="../index.html#tools" data-i18n="nav_tools">Tools</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switch">
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('zh')">中文</button>
            </div>
            <div class="theme-switch">
                <button onclick="setTheme('light')">☀️</button>
                <button onclick="setTheme('dark')">🌙</button>
                <button onclick="setTheme('auto')">🔄</button>
            </div>
        </div>
    </header>
    <main>
        <section class="tool-hero">
            <h1>Gradient Generator</h1>
            <p>Generate CSS gradients with visual preview.</p>
        </section>
        <section class="tool-container">
            <div class="gradient-preview" id="gradientPreview"></div>
            <div class="gradient-controls">
                <div class="control-group">
                    <label>Type:</label>
                    <select id="gType" onchange="updateGradient()">
                        <option value="linear">Linear</option>
                        <option value="radial">Radial</option>
                        <option value="conic">Conic</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Direction:</label>
                    <input type="range" id="gDirection" min="0" max="360" value="180" oninput="updateGradient()">
                    <span id="gDirectionVal">180deg</span>
                </div>
                <div class="control-group">
                    <label>Color 1:</label>
                    <input type="color" id="gColor1" value="#3b82f6" oninput="updateGradient()">
                    <input type="range" id="gColor1Pos" min="0" max="100" value="0" oninput="updateGradient()">
                    <span id="gColor1PosVal">0%</span>
                </div>
                <div class="control-group">
                    <label>Color 2:</label>
                    <input type="color" id="gColor2" value="#8b5cf6" oninput="updateGradient()">
                    <input type="range" id="gColor2Pos" min="0" max="100" value="100" oninput="updateGradient()">
                    <span id="gColor2PosVal">100%</span>
                </div>
                <button class="btn" onclick="addGradientColor()">Add Color</button>
                <button class="btn btn-secondary" onclick="removeGradientColor()">Remove Color</button>
                <button class="btn" onclick="copyGradient()">Copy CSS</button>
            </div>
            <div class="gradient-output">
                <textarea id="gOutput" readonly rows="3"></textarea>
            </div>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">Free Tools - All tools are free and open source.</p>
    </footer>
    <script src="../i18n.js"></script>
    <script src="../theme.js"></script>
    <script>
        const colors = [
            { color: '#3b82f6', pos: 0 },
            { color: '#8b5cf6', pos: 100 }
        ];

        function updateGradient() {
            const type = document.getElementById('gType').value;
            const direction = document.getElementById('gDirection').value;
            
            // Update labels
            document.getElementById('gDirectionVal').textContent = direction + 'deg';
            document.getElementById('gColor1PosVal').textContent = document.getElementById('gColor1Pos').value + '%';
            document.getElementById('gColor2PosVal').textContent = document.getElementById('gColor2Pos').value + '%';
            
            // Update colors array
            colors[0].color = document.getElementById('gColor1').value;
            colors[0].pos = parseInt(document.getElementById('gColor1Pos').value);
            colors[1].color = document.getElementById('gColor2').value;
            colors[1].pos = parseInt(document.getElementById('gColor2Pos').value);
            
            // Generate gradient string
            let gradient;
            const colorStops = colors.map(c => `${c.color} ${c.pos}%`).join(', ');
            
            if (type === 'linear') {
                gradient = `linear-gradient(${direction}deg, ${colorStops})`;
            } else if (type === 'radial') {
                gradient = `radial-gradient(circle, ${colorStops})`;
            } else if (type === 'conic') {
                gradient = `conic-gradient(from ${direction}deg, ${colorStops})`;
            }
            
            document.getElementById('gradientPreview').style.background = gradient;
            document.getElementById('gOutput').value = `background: ${gradient};`;
        }

        function addGradientColor() {
            if (colors.length >= 5) return;
            const lastColor = colors[colors.length - 1];
            const newColor = {
                color: '#' + Math.floor(Math.random()*16777215).toString(16),
                pos: 50
            };
            colors.splice(colors.length - 1, 0, newColor);
            renderColorInputs();
            updateGradient();
        }

        function removeGradientColor() {
            if (colors.length <= 2) return;
            colors.pop();
            renderColorInputs();
            updateGradient();
        }

        function renderColorInputs() {
            // This is a simplified version - in a real implementation, you'd dynamically create input elements
            // For now, we'll just support 2 colors
        }

        function copyGradient() {
            const output = document.getElementById('gOutput');
            output.select();
            document.execCommand('copy');
            alert('CSS copied to clipboard!');
        }

        // Initialize
        updateGradient();
    </script>
</body>
</html>
