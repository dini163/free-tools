<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator - Free Tools</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../i18n.css">
    <link rel="stylesheet" href="../theme.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">
            <span class="logo-icon">🔧</span>
            <span class="logo-text">Free Tools</span>
        </div>
        <nav>
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="../index.html#tools" data-i18n="nav_tools">Tools</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switch">
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('zh')">中文</button>
            </div>
            <div class="theme-switch">
                <button onclick="setTheme('light')">☀️</button>
                <button onclick="setTheme('dark')">🌙</button>
                <button onclick="setTheme('auto')">🔄</button>
            </div>
        </div>
    </header>
    <main>
        <section class="tool-hero">
            <h1 data-i18n="pct_title">Percentage Calculator</h1>
            <p data-i18n="pct_desc">Calculate percentages, percentage increase/decrease, and percentage difference.</p>
        </section>
        <section class="tool-container">
            <div class="pct-modes">
                <button class="pct-mode-btn active" onclick="switchPctMode('basic')" data-i18n="pct_basic">Basic Percentage</button>
                <button class="pct-mode-btn" onclick="switchPctMode('increase')" data-i18n="pct_increase">Percentage Increase</button>
                <button class="pct-mode-btn" onclick="switchPctMode('difference')" data-i18n="pct_diff">Percentage Difference</button>
            </div>

            <!-- Basic Percentage -->
            <div id="pctBasic" class="pct-section">
                <p data-i18n="pct_basic_desc">What is X% of Y?</p>
                <div class="input-group">
                    <input type="number" id="pctX" placeholder="X" oninput="calcBasicPct()">
                    <span>% of</span>
                    <input type="number" id="pctY" placeholder="Y" oninput="calcBasicPct()">
                    <span>=</span>
                    <input type="text" id="pctResult" readonly>
                </div>
            </div>

            <!-- Percentage Increase/Decrease -->
            <div id="pctIncrease" class="pct-section" style="display:none;">
                <p data-i18n="pct_increase_desc">Percentage increase/decrease from X to Y</p>
                <div class="input-group">
                    <label data-i18n="pct_from">From:</label>
                    <input type="number" id="pctFrom" placeholder="Original value" oninput="calcPctIncrease()">
                    <label data-i18n="pct_to">To:</label>
                    <input type="number" id="pctTo" placeholder="New value" oninput="calcPctIncrease()">
                </div>
                <div class="pct-result" id="pctIncreaseResult"></div>
            </div>

            <!-- Percentage Difference -->
            <div id="pctDifference" class="pct-section" style="display:none;">
                <p data-i18n="pct_diff_desc">X is what percentage of Y?</p>
                <div class="input-group">
                    <input type="number" id="pctPart" placeholder="X" oninput="calcPctDifference()">
                    <span data-i18n="pct_is_what">is</span>
                    <input type="number" id="pctWhole" placeholder="Y" oninput="calcPctDifference()">
                    <span>% of</span>
                    <input type="text" id="pctDiffResult" readonly>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">Free Tools - All tools are free and open source.</p>
    </footer>
    <script src="../i18n.js"></script>
    <script src="../theme.js"></script>
    <script>
        function switchPctMode(mode) {
            document.querySelectorAll('.pct-mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('pctBasic').style.display = mode === 'basic' ? 'block' : 'none';
            document.getElementById('pctIncrease').style.display = mode === 'increase' ? 'block' : 'none';
            document.getElementById('pctDifference').style.display = mode === 'difference' ? 'block' : 'none';
        }

        function calcBasicPct() {
            const x = parseFloat(document.getElementById('pctX').value);
            const y = parseFloat(document.getElementById('pctY').value);
            
            if (isNaN(x) || isNaN(y)) {
                document.getElementById('pctResult').value = '';
                return;
            }
            
            const result = (x / 100) * y;
            document.getElementById('pctResult').value = result.toFixed(6).replace(/\.?0+$/, '');
        }

        function calcPctIncrease() {
            const from = parseFloat(document.getElementById('pctFrom').value);
            const to = parseFloat(document.getElementById('pctTo').value);
            
            if (isNaN(from) || isNaN(to) || from === 0) {
                document.getElementById('pctIncreaseResult').textContent = '';
                return;
            }
            
            const increase = ((to - from) / from) * 100;
            const sign = increase >= 0 ? '+' : '';
            document.getElementById('pctIncreaseResult').textContent = `${sign}${increase.toFixed(2)}%`;
        }

        function calcPctDifference() {
            const part = parseFloat(document.getElementById('pctPart').value);
            const whole = parseFloat(document.getElementById('pctWhole').value);
            
            if (isNaN(part) || isNaN(whole) || whole === 0) {
                document.getElementById('pctDiffResult').value = '';
                return;
            }
            
            const result = (part / whole) * 100;
            document.getElementById('pctDiffResult').value = result.toFixed(6).replace(/\.?0+$/, '') + '%';
        }
    </script>
</body>
</html>
