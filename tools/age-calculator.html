<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Free Tools</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../i18n.css">
    <link rel="stylesheet" href="../theme.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">
            <span class="logo-icon">📅</span>
            <span class="logo-text">Free Tools</span>
        </div>
        <nav>
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="../index.html#tools" data-i18n="nav_tools">Tools</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switch">
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('zh')">中文</button>
            </div>
            <div class="theme-switch">
                <button onclick="setTheme('light')">☀️</button>
                <button onclick="setTheme('dark')">🌙</button>
                <button onclick="setTheme('auto')">🔄</button>
            </div>
        </div>
    </header>
    <main>
        <section class="tool-hero">
            <h1 data-i18n="age_title">Age Calculator</h1>
            <p data-i18n="age_desc">Calculate your exact age in years, months, and days.</p>
        </section>
        <section class="tool-container">
            <div class="age-input">
                <label data-i18n="age_birth">Birth Date:</label>
                <input type="date" id="birthDate" onchange="calculateAge()">
            </div>
            <div class="age-result" id="ageResult">
                <div class="age-unit">
                    <span class="age-value" id="ageYears">-</span>
                    <span class="age-label" data-i18n="age_years">Years</span>
                </div>
                <div class="age-unit">
                    <span class="age-value" id="ageMonths">-</span>
                    <span class="age-label" data-i18n="age_months">Months</span>
                </div>
                <div class="age-unit">
                    <span class="age-value" id="ageDays">-</span>
                    <span class="age-label" data-i18n="age_days">Days</span>
                </div>
            </div>
            <div class="age-details" id="ageDetails">
                <p data-i18n="age_total_days">Total Days: <span id="totalDays">-</span></p>
                <p data-i18n="age_next_birthday">Next Birthday: <span id="nextBirthday">-</span></p>
            </div>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">Free Tools - All tools are free and open source.</p>
    </footer>
    <script src="../i18n.js"></script>
    <script src="../theme.js"></script>
    <script>
        function calculateAge() {
            const birthDate = new Date(document.getElementById('birthDate').value);
            
            if (isNaN(birthDate.getTime())) {
                document.getElementById('ageYears').textContent = '-';
                document.getElementById('ageMonths').textContent = '-';
                document.getElementById('ageDays').textContent = '-';
                document.getElementById('totalDays').textContent = '-';
                document.getElementById('nextBirthday').textContent = '-';
                return;
            }
            
            const today = new Date();
            
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();
            
            if (days < 0) {
                months--;
                const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate();
            }
            
            if (months < 0) {
                years--;
                months += 12;
            }
            
            document.getElementById('ageYears').textContent = years;
            document.getElementById('ageMonths').textContent = months;
            document.getElementById('ageDays').textContent = days;
            
            // Calculate total days
            const timeDiff = today.getTime() - birthDate.getTime();
            const totalDays = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            document.getElementById('totalDays').textContent = totalDays.toLocaleString();
            
            // Calculate next birthday
            const nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            if (nextBirthday < today) {
                nextBirthday.setFullYear(today.getFullYear() + 1);
            }
            const daysUntilBirthday = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24));
            document.getElementById('nextBirthday').textContent = daysUntilBirthday + ' days';
        }
        
        // Set max date to today
        document.getElementById('birthDate').max = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
