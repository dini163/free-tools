<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Border Radius Generator - Free Tools</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../i18n.css">
    <link rel="stylesheet" href="../theme.css">
</head>
<body>
    <header>
        <div class="logo" onclick="location.href='../index.html'">
            <span class="logo-icon">🔲</span>
            <span class="logo-text">Free Tools</span>
        </div>
        <nav>
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="../index.html#tools" data-i18n="nav_tools">Tools</a>
        </nav>
        <div class="header-actions">
            <div class="lang-switch">
                <button onclick="setLang('en')">EN</button>
                <button onclick="setLang('zh')">中文</button>
            </div>
            <div class="theme-switch">
                <button onclick="setTheme('light')">☀️</button>
                <button onclick="setTheme('dark')">🌙</button>
                <button onclick="setTheme('auto')">🔄</button>
            </div>
        </div>
    </header>
    <main>
        <section class="tool-hero">
            <h1>CSS Border Radius Generator</h1>
            <p>Generate CSS border-radius with visual preview.</p>
        </section>
        <section class="tool-container">
            <div class="border-radius-preview" id="borderRadiusPreview"></div>
            <div class="border-radius-controls">
                <div class="control-group">
                    <label>Top-Left:</label>
                    <input type="range" id="brTopLeft" min="0" max="100" value="0" oninput="updateBorderRadius()">
                    <span id="brTopLeftVal">0px</span>
                </div>
                <div class="control-group">
                    <label>Top-Right:</label>
                    <input type="range" id="brTopRight" min="0" max="100" value="0" oninput="updateBorderRadius()">
                    <span id="brTopRightVal">0px</span>
                </div>
                <div class="control-group">
                    <label>Bottom-Right:</label>
                    <input type="range" id="brBottomRight" min="0" max="100" value="0" oninput="updateBorderRadius()">
                    <span id="brBottomRightVal">0px</span>
                </div>
                <div class="control-group">
                    <label>Bottom-Left:</label>
                    <input type="range" id="brBottomLeft" min="0" max="100" value="0" oninput="updateBorderRadius()">
                    <span id="brBottomLeftVal">0px</span>
                </div>
                <div class="control-group">
                    <label><input type="checkbox" id="brUniform" onchange="toggleUniform()"> Uniform</label>
                </div>
                <button class="btn" onclick="copyBorderRadius()">Copy CSS</button>
            </div>
            <div class="border-radius-output">
                <textarea id="brOutput" readonly rows="3"></textarea>
            </div>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">Free Tools - All tools are free and open source.</p>
    </footer>
    <script src="../i18n.js"></script>
    <script src="../theme.js"></script>
    <script>
        function updateBorderRadius() {
            const topLeft = document.getElementById('brTopLeft').value;
            const topRight = document.getElementById('brTopRight').value;
            const bottomRight = document.getElementById('brBottomRight').value;
            const bottomLeft = document.getElementById('brBottomLeft').value;
            const uniform = document.getElementById('brUniform').checked;

            // Update labels
            document.getElementById('brTopLeftVal').textContent = topLeft + 'px';
            document.getElementById('brTopRightVal').textContent = topRight + 'px';
            document.getElementById('brBottomRightVal').textContent = bottomRight + 'px';
            document.getElementById('brBottomLeftVal').textContent = bottomLeft + 'px';

            // If uniform, sync all values
            if (uniform) {
                document.getElementById('brTopRight').value = topLeft;
                document.getElementById('brBottomRight').value = topLeft;
                document.getElementById('brBottomLeft').value = topLeft;
                document.getElementById('brTopRightVal').textContent = topLeft + 'px';
                document.getElementById('brBottomRightVal').textContent = topLeft + 'px';
                document.getElementById('brBottomLeftVal').textContent = topLeft + 'px';
            }

            // Apply to preview
            const radius = uniform 
                ? `${topLeft}px`
                : `${topLeft}px ${topRight}px ${bottomRight}px ${bottomLeft}px`;
            
            document.getElementById('borderRadiusPreview').style.borderRadius = radius;
            document.getElementById('brOutput').value = `border-radius: ${radius};`;
        }

        function toggleUniform() {
            const uniform = document.getElementById('brUniform').checked;
            if (uniform) {
                const topLeft = document.getElementById('brTopLeft').value;
                document.getElementById('brTopRight').value = topLeft;
                document.getElementById('brBottomRight').value = topLeft;
                document.getElementById('brBottomLeft').value = topLeft;
            }
            updateBorderRadius();
        }

        function copyBorderRadius() {
            const output = document.getElementById('brOutput');
            output.select();
            document.execCommand('copy');
            alert('CSS copied to clipboard!');
        }

        // Initialize
        updateBorderRadius();
    </script>
</body>
</html>
