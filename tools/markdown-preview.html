<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9267698062788796"
     crossorigin="anonymous"></script>
    <title>Markdown Preview - Free Online Tool</title>
    <meta name="description" content="Write Markdown syntax and see rendered HTML live preview instantly. Simple, secure browser-based editor.">
    <meta name="keywords" content="markdown preview, markdown editor, markdown to html, free markdown tool">
    <link rel="canonical" href="https://dini163.github.io/free-tools/tools/markdown-preview.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="../index.html" class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </div>
            FreeDevTools
        </a>
        <nav class="nav-links">
            <a href="../index.html">All Tools</a>
        </nav>
    </div>
</header>

<main style="max-width: 1000px; margin-top: 2rem;">
    <h1 class="tool-title">Markdown Preview</h1>
    <p class="tool-desc">Draft markdown syntax on the left pane and instantly view clean rendered HTML structures on the right pane.</p>
    
    <div class="tool-row" style="height: 500px; align-items: stretch; margin-bottom: 2rem;">
        <div class="tool-col" style="display: flex; flex-direction: column;">
            <label class="tool-label">Markdown Draft Source</label>
            <textarea class="tool-textarea" id="mdInput" style="flex: 1; min-height: auto; margin-bottom: 0;" placeholder="# Hello\n\n**Bold text** and *italicized*\n\n- List element A\n- List element B\n\n`code block`" oninput="renderMarkdown()"></textarea>
        </div>
        <div class="tool-col" style="display: flex; flex-direction: column;">
            <label class="tool-label">Rendered HTML Preview</label>
            <div class="tool-output" id="mdPreview" style="flex: 1; min-height: auto; margin-bottom: 0; overflow-y: auto; background: rgba(3, 7, 18, 0.5);"></div>
        </div>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 FreeDevTools. All tools run 100% locally in your web browser — absolutely no data is transmitted to any server. Check the <a href="https://github.com/dini163/free-tools" target="_blank">GitHub Repository</a>.</p>
</footer>

<script>
function renderMarkdown() {
    let md = document.getElementById('mdInput').value;
    // Simple custom markup translators
    md = md.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    md = md.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    md = md.replace(/\*(.*?)\*/g, '<em>$1</em>');
    md = md.replace(/`(.*?)`/g, '<code style="background:var(--bg-card);padding:2px 6px;border-radius:4px;">$1</code>');
    md = md.replace(/^### (.*$)/gm, '<h3 style="margin:1rem 0 0.5rem;font-family:\'Plus Jakarta Sans\',sans-serif;">$1</h3>');
    md = md.replace(/^## (.*$)/gm, '<h2 style="margin:1.25rem 0 0.5rem;font-family:\'Plus Jakarta Sans\',sans-serif;border-bottom:1px solid var(--border);padding-bottom:0.25rem;">$1</h2>');
    md = md.replace(/^# (.*$)/gm, '<h1 style="margin:1.5rem 0 0.75rem;font-family:\'Plus Jakarta Sans\',sans-serif;border-bottom:1px solid var(--border);padding-bottom:0.375rem;">$1</h1>');
    md = md.replace(/^- (.*$)/gm, '<li style="margin-left:1.5rem;">$1</li>');
    md = md.replace(/\n\n/g, '<br>');
    document.getElementById('mdPreview').innerHTML = md;
}

// Initial render
renderMarkdown();
</script>
</body>
</html>
