<main style="max-width: 1000px; margin-top: 2rem;">
    <h1 class="tool-title" data-i18n="md_title">Markdown Preview</h1>
    <p class="tool-desc" data-i18n="md_desc">Draft markdown syntax on the left pane and instantly view clean rendered HTML structures on the right pane.</p>
    
    <div class="tool-row" style="height: 500px; align-items: stretch; margin-bottom: 2rem;">
        <div class="tool-col" style="display: flex; flex-direction: column;">
            <label class="tool-label" data-i18n="md_write">Markdown Draft Source</label>
            <textarea class="tool-textarea" id="mdInput" style="flex: 1; min-height: auto; margin-bottom: 0;" placeholder="# Hello\n\n**Bold text** and *italicized*\n\n- List element A\n- List element B\n\n`code block`" oninput="renderMarkdown()"></textarea>
        </div>
        <div class="tool-col" style="display: flex; flex-direction: column;">
            <label class="tool-label" data-i18n="md_preview">Rendered HTML Preview</label>
            <div class="tool-output" id="mdPreview" style="flex: 1; min-height: auto; margin-bottom: 0; overflow-y: auto; background: rgba(3, 7, 18, 0.5);"></div>
        </div>

<script>
function renderMarkdown() {
    let md = document.getElementById('mdInput').value;
    // Simple custom markup translators
    md = md.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    md = md.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    md = md.replace(/\*(.*?)\*/g, '<em>$1</em>');
    md = md.replace(/`(.*?)`/g, '<code style="background:var(--bg-card);padding:2px 6px;border-radius:4px;">$1</code>');
    md = md.replace(/^### (.*$)/gm, '<h3 style="margin:1rem 0 0.5rem;font-family:\'Plus Jakarta Sans\',sans-serif;">$1</h3>');
    md = md.replace(/^## (.*$)/gm, '<h2 style="margin:1.25rem 0 0.5rem;font-family:\'Plus Jakarta Sans\',sans-serif;border-bottom:1px solid var(--border);padding-bottom:0.25rem;">$1</h2>');
    md = md.replace(/^# (.*$)/gm, '<h1 style="margin:1.5rem 0 0.75rem;font-family:\'Plus Jakarta Sans\',sans-serif;border-bottom:1px solid var(--border);padding-bottom:0.375rem;">$1</h1>');
    md = md.replace(/^- (.*$)/gm, '<li style="margin-left:1.5rem;">$1</li>');
    md = md.replace(/\n\n/g, '<br>');
    document.getElementById('mdPreview').innerHTML = md;
}

// Initial render
renderMarkdown();
</script>
