<script>
async function generateHashes() {
    const t = document.getElementById('hashInput').value;
    if (!t) {
        document.getElementById('sha256').textContent = '-';
        document.getElementById('sha1').textContent = '-';
        document.getElementById('md5').textContent = '-';
        return;
    }
    const buf = new TextEncoder().encode(t);
    try {
        const sha256Buf = await crypto.subtle.digest('SHA-256', buf);
        document.getElementById('sha256').textContent = Array.from(new Uint8Array(sha256Buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    } catch(e) { document.getElementById('sha256').textContent = 'Error'; }
    try {
        const sha1Buf = await crypto.subtle.digest('SHA-1', buf);
        document.getElementById('sha1').textContent = Array.from(new Uint8Array(sha1Buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    } catch(e) { document.getElementById('sha1').textContent = 'Error'; }
    document.getElementById('md5').textContent = md5Polyfill(t);
}

function md5Polyfill(str) {
    function rotl(q, r) { return (q << r) | (q >>> (32 - r)); }
    let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476;
    const bytes = new TextEncoder().encode(str);
    const len = bytes.length;
    const bits = len << 3;
    const padLen = (len % 64 < 56) ? (56 - len % 64) : (120 - len % 64);
    const padded = new Uint8Array(len + padLen + 8);
    padded.set(bytes);
    padded[len] = 0x80;
    padded[padded.length - 8] = (bits >>> 0) & 0xFF;
    padded[padded.length - 7] = (bits >>> 8) & 0xFF;
    padded[padded.length - 6] = (bits >>> 16) & 0xFF;
    padded[padded.length - 5] = (bits >>> 24) & 0xFF;
    for (let i = 0; i < padded.length; i += 64) {
        let a = h0, b = h1, c = h2, d = h3;
        for (let j = 0; j < 64; j++) {
            let f, g;
            if (j < 16) { f = (b & c) | ((~b) & d); g = j; }
            else if (j < 32) { f = (d & b) | ((~d) & c); g = (5 * j + 1) % 16; }
            else if (j < 48) { f = b ^ c ^ d; g = (3 * j + 5) % 16; }
            else { f = c ^ (b | (~d)); g = (7 * j) % 16; }
            f = (f + a + (function() {
                const k = [0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a];
                return k[j];
            })() + ((padded[i + g * 4]) | (padded[i + g * 4 + 1] << 8) | (padded[i + g * 4 + 2] << 16) | (padded[i + g * 4 + 3] << 24))) & 0xFFFFFFFF;
            a = d; d = c; c = b; b = (b + f) & 0xFFFFFFFF;
        }
        h0 = (h0 + a) & 0xFFFFFFFF; h1 = (h1 + b) & 0xFFFFFFFF; h2 = (h2 + c) & 0xFFFFFFFF; h3 = (h3 + d) & 0xFFFFFFFF;
    }
    return [h0,h1,h2,h3].map(h => (h >>> 0).toString(16).padStart(8,'0')).join('');
}

function copyText(id) {
    const el = document.getElementById(id);
    navigator.clipboard.writeText(el.textContent).then(() => {
        const btns = document.querySelectorAll('.copy-btn');
        btns.forEach(btn => {
            const prev = btn.textContent;
            btn.textContent = 'Copied!';
            btn.style.color = 'var(--success)';
            btn.style.borderColor = 'var(--success)';
            setTimeout(() => { btn.textContent = prev; btn.style.color = ''; btn.style.borderColor = ''; }, 1500);
        });
    });
}
