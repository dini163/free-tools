:root {
  --bg: var(--bg-primary);
  --surface: var(--bg-card);
  --border: var(--border);
  --text: var(--text-primary);
  --text2: var(--text-secondary);
  --text3: var(--text-muted);
  --primary: var(--accent-light);
  --primary-light: var(--accent-glow);
  --primary-bg: var(--accent-glow);
  --primary-dark: var(--accent);
  --success: var(--success);
  --warning: var(--warning);
  --yellow: var(--warning);
  --red: var(--error);
  --danger: var(--error);
  --shadow: var(--shadow);
  --radius: var(--radius);
  --radius-sm: var(--radius-sm);
  --todo: rgba(99, 102, 241, 0.1);
  --progress: rgba(245, 158, 11, 0.1);
  --done: rgba(16, 185, 129, 0.1);
  --white-key: #ffffff;
  --black-key: #09090b;
}
.theme-light {
  --primary: var(--accent);
  --primary-dark: var(--accent-dark);
  --primary-light: rgba(99, 102, 241, 0.08);
  --primary-bg: rgba(99, 102, 241, 0.08);
  --todo: #eff6ff;
  --progress: #fef9c3;
  --done: #dcfce7;
  --white-key: #f4f4f5;
  --black-key: #27272a;
}
*{box-sizing:border-box;margin:0;padding:0}
.tool-body-style {font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column;user-select:none}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:44px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-weight:700;font-size:15px;color:var(--primary)}
.header-actions{display:flex;gap:6px}
.btn{padding:5px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover{background:#353550}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#6b7df0}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-danger{color:#ff6b6b;border-color:#ff6b6b33}
.btn-danger:hover{background:#ff6b6b22}
main{display:flex;flex:1;overflow:hidden}
.toolbar{width:52px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;flex-shrink:0}
.tool-btn{width:38px;height:38px;border-radius:var(--radius-sm);border:2px solid transparent;background:none;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tool-btn:hover{background:#353550;color:var(--text)}
.tool-btn.active{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;background:#1a1a28;position:relative;overflow:hidden}
#mainCanvas{image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;box-shadow:0 0 30px rgba(0,0,0,.4)}
.zoom-info{position:absolute;bottom:12px;right:16px;font-size:11px;color:var(--text3);background:var(--surface);padding:4px 10px;border-radius:10px}
.right-panel{width:240px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.panel-section{padding:12px;border-bottom:1px solid var(--border)}
.panel-section h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px}
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-bottom:8px}
.color-swatch{aspect-ratio:1;border-radius:3px;border:2px solid transparent;cursor:pointer;transition:all .1s}
.color-swatch:hover{border-color:#fff;transform:scale(1.15)}
.color-swatch.active{border-color:#fff;box-shadow:0 0 6px rgba(255,255,255,.4)}
.color-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.color-row input[type=color]{width:30px;height:30px;border:none;border-radius:3px;cursor:pointer;background:none;padding:0}
.color-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.color-row input[type=color]::-webkit-color-swatch{border:1px solid var(--border);border-radius:3px}
.size-row{display:flex;gap:4px}
.size-row input{flex:1;padding:5px 6px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;width:50px;text-align:center;font-family:inherit}
.size-row input:focus{outline:none;border-color:var(--primary)}
.frames-bar{background:var(--surface);border-top:1px solid var(--border);padding:8px 16px;display:flex;gap:6px;align-items:center;overflow-x:auto;flex-shrink:0;min-height:60px}
.frame-thumb{width:42px;height:42px;border:2px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;position:relative;background:#1a1a28;image-rendering:pixelated}
.frame-thumb.active{border-color:var(--primary)}
.frame-thumb .num{position:absolute;bottom:1px;right:2px;font-size:8px;color:var(--text3);background:rgba(0,0,0,.6);padding:0 3px;border-radius:2px}
.frame-thumb canvas{width:100%;height:100%;image-rendering:pixelated}
.btn-frame{width:42px;height:42px;border:2px dashed var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:20px;background:none;transition:all .15s}
.btn-frame:hover{border-color:var(--primary);color:var(--primary)}
.layers-list{display:flex;flex-direction:column-reverse;gap:2px}
.layer-item{padding:6px 8px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;border:1px solid transparent}
.layer-item:hover{background:#353550}
.layer-item.active{border-color:var(--primary);background:var(--primary-bg)}
.layer-item canvas{width:24px;height:24px;image-rendering:pixelated;border-radius:2px;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="4" height="4" fill="%23333"/><rect x="4" y="4" width="4" height="4" fill="%23333"/></svg>')}
.layer-vis{width:16px;height:16px;cursor:pointer;opacity:.5;text-align:center;font-size:12px}
.layer-vis.visible{opacity:1}

main { height: calc(100vh - 120px) !important; overflow: hidden !important; }

<script>

const DEFAULT_COLORS = [
  '#000000','#ffffff','#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff',
  '#333333','#666666','#999999','#cccccc','#880000','#008800','#000088','#888800',
  '#ff8800','#88ff00','#00ff88','#0088ff','#8800ff','#ff0088','#ff4444','#44ff44',
  '#4444ff','#ffaa00','#aaff00','#00ffaa','#00aaff','#aa00ff','#ff88aa','#aa88ff',
  '#4a3728','#8b5e3c','#c4884d','#d4a76a','#e8d5b7','#f5e6d3','#2d5016','#4a7c24',
  '#6ba32d','#8bc34a','#aed581','#c5e1a5','#1a237e','#283593','#3949ab','#5c6bc0'
];

let palette = [...DEFAULT_COLORS];
let currentColor = '#7c8aff';
let currentTool = 'pen';
let canvasW = 16, canvasH = 16;
let scale = 20;
let showGrid = true;
let layers = [];
let currentLayer = 0;
let frames = [];
let currentFrame = 0;
let undoStack = [], redoStack = [];
let isDrawing = false;
let lineStart = null;
let pickerActive = false;

// Canvas init
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

function initCanvases(w, h) {
  const data = new Uint8ClampedArray(w * h * 4);
  for (let i = 0; i < data.length; i += 4) { data[i]=0; data[i+1]=0; data[i+2]=0; data[i+3]=0; }
  return { w, h, data, visible: true };
}

function init() {
  canvasW = parseInt(document.getElementById('canvasW').value) || 16;
  canvasH = parseInt(document.getElementById('canvasH').value) || 16;
  layers = [initCanvases(canvasW, canvasH)];
  currentLayer = 0;
  frames = [cloneLayers(layers)];
  currentFrame = 0;
  undoStack = []; redoStack = [];
  renderPalette();
  renderLayers();
  renderFrames();
  updateCanvas();
  updateZoomInfo();
}

function cloneLayers(lyrs) {
  return lyrs.map(l => ({
    w: l.w, h: l.h,
    data: new Uint8ClampedArray(l.data),
    visible: l.visible
  }));
}

function pushUndo() {
  undoStack.push({
    layers: cloneLayers(layers),
    currentLayer
  });
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push({ layers: cloneLayers(layers), currentLayer });
  const state = undoStack.pop();
  layers = state.layers;
  currentLayer = state.currentLayer;
  // Update frame
  frames[currentFrame] = cloneLayers(layers);
  updateCanvas();
  renderLayers();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push({ layers: cloneLayers(layers), currentLayer });
  const state = redoStack.pop();
  layers = state.layers;
  currentLayer = state.currentLayer;
  frames[currentFrame] = cloneLayers(layers);
  updateCanvas();
  renderLayers();
}

// Palette
function renderPalette() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = palette.map((c, i) =>
    `<div class="color-swatch${c===currentColor?' active':''}" style="background:${c}" data-color="${c}" data-idx="${i}"
      onclick="selectColor('${c}', this)" oncontextmenu="event.preventDefault();removeColor(${i})"></div>`
  ).join('');
}

function selectColor(c, el) {
  currentColor = c;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('colorPicker').value = c;
}

function addColor() {
  const c = document.getElementById('colorPicker').value;
  if (!palette.includes(c)) {
    palette.push(c);
    renderPalette();
    selectColor(c, document.querySelector(`[data-color="${c}"]`));
  }
}

function removeColor(idx) {
  if (palette.length <= 8) return;
  palette.splice(idx, 1);
  renderPalette();
}

document.getElementById('colorPicker').addEventListener('input', function() {
  currentColor = this.value;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
});

// Tools
document.getElementById('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('.tool-btn');
  if (!btn || btn.id === 'gridToggle') return;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTool = btn.dataset.tool;
});

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - rect.left) / scale),
    y: Math.floor((e.clientY - rect.top) / scale)
  };
}

function hexToRGBA(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b,255];
}

function getPixel(layer, x, y) {
  if (x<0||x>=layer.w||y<0||y>=layer.h) return null;
  const i = (y*layer.w+x)*4;
  return [layer.data[i],layer.data[i+1],layer.data[i+2],layer.data[i+3]];
}

function setPixel(layer, x, y, rgba) {
  if (x<0||x>=layer.w||y<0||y>=layer.h) return;
  const i = (y*layer.w+x)*4;
  layer.data[i]=rgba[0]; layer.data[i+1]=rgba[1]; layer.data[i+2]=rgba[2]; layer.data[i+3]=rgba[3];
}

function floodFill(layer, x, y, fillRGBA) {
  const target = getPixel(layer, x, y);
  if (!target) return;
  const tr = target[0], tg = target[1], tb = target[2], ta = target[3];
  const fr = fillRGBA[0], fg = fillRGBA[1], fb = fillRGBA[2], fa = fillRGBA[3];
  if (tr===fr && tg===fg && tb===fb && ta===fa) return;
  const stack = [[x,y]];
  const visited = new Set();
  while (stack.length) {
    const [cx, cy] = stack.pop();
    const key = `${cx},${cy}`;
    if (visited.has(key)) continue;
    visited.add(key);
    const p = getPixel(layer, cx, cy);
    if (!p || p[0]!==tr || p[1]!==tg || p[2]!==tb || p[3]!==ta) continue;
    setPixel(layer, cx, cy, fillRGBA);
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
}

function drawLine(layer, x1, y1, x2, y2, rgba) {
  const dx = Math.abs(x2-x1), dy = Math.abs(y2-y1);
  const sx = x1<x2?1:-1, sy = y1<y2?1:-1;
  let err = dx-dy;
  while (true) {
    setPixel(layer, x1, y1, rgba);
    if (x1===x2 && y1===y2) break;
    const e2 = 2*err;
    if (e2 > -dy) { err -= dy; x1 += sx; }
    if (e2 < dx) { err += dx; y1 += sy; }
  }
}

function drawRect(layer, x1, y1, x2, y2, rgba, fill=false) {
  const lx = Math.min(x1,x2), rx = Math.max(x1,x2);
  const ty = Math.min(y1,y2), by = Math.max(y1,y2);
  if (fill) {
    for (let y=ty; y<=by; y++)
      for (let x=lx; x<=rx; x++)
        setPixel(layer, x, y, rgba);
  } else {
    for (let x=lx; x<=rx; x++) { setPixel(layer, x, ty, rgba); setPixel(layer, x, by, rgba); }
    for (let y=ty; y<=by; y++) { setPixel(layer, lx, y, rgba); setPixel(layer, rx, y, rgba); }
  }
}

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const pos = getCanvasPos(e);
  if (pos.x<0||pos.x>=canvasW||pos.y<0||pos.y>=canvasH) return;

  if (currentTool === 'picker') {
    pickerActive = true;
    pickColor(pos);
    return;
  }

  pushUndo();
  isDrawing = true;
  const rgba = hexToRGBA(currentColor);
  const layer = layers[currentLayer];

  if (currentTool === 'fill') {
    floodFill(layer, pos.x, pos.y, rgba);
  } else if (currentTool === 'line' || currentTool === 'rect') {
    lineStart = pos;
  } else {
    // pen or eraser
    const eraserRGBA = [0,0,0,0];
    setPixel(layer, pos.x, pos.y, currentTool==='eraser'?eraserRGBA:rgba);
  }
  syncFrame();
  updateCanvas();
});

canvas.addEventListener('mousemove', e => {
  if (pickerActive) {
    const pos = getCanvasPos(e);
    if (pos.x>=0 && pos.x<canvasW && pos.y>=0 && pos.y<canvasH) pickColor(pos);
    return;
  }

  if (!isDrawing) return;
  const pos = getCanvasPos(e);
  if (pos.x<0||pos.x>=canvasW||pos.y<0||pos.y>=canvasH) return;
  const rgba = hexToRGBA(currentColor);
  const layer = layers[currentLayer];

  if (currentTool === 'pen') {
    setPixel(layer, pos.x, pos.y, rgba);
  } else if (currentTool === 'eraser') {
    setPixel(layer, pos.x, pos.y, [0,0,0,0]);
  } else if ((currentTool==='line'||currentTool==='rect') && lineStart) {
    // Preview: restore then redraw
    syncFrame();
    const preview = cloneLayers(layers);
    if (currentTool==='line') drawLine(preview[currentLayer], lineStart.x, lineStart.y, pos.x, pos.y, rgba);
    else drawRect(preview[currentLayer], lineStart.x, lineStart.y, pos.x, pos.y, rgba);
    renderComposite(preview);
    return;
  }
  syncFrame();
  updateCanvas();
});

canvas.addEventListener('mouseup', () => {
  if (pickerActive) { pickerActive = false; return; }
  if (!isDrawing) return;
  if (lineStart && (currentTool==='line'||currentTool==='rect')) {
    const pos = getCanvasPos({clientX:event.clientX,clientY:event.clientY});
    const rgba = hexToRGBA(currentColor);
    const layer = layers[currentLayer];
    if (currentTool==='line') drawLine(layer, lineStart.x, lineStart.y, pos.x, pos.y, rgba);
    else drawRect(layer, lineStart.x, lineStart.y, pos.x, pos.y, rgba);
    lineStart = null;
    syncFrame();
    updateCanvas();
  }
  isDrawing = false;
  lineStart = null;
});

canvas.addEventListener('mouseleave', () => { isDrawing = false; lineStart = null; pickerActive = false; });

function pickColor(pos) {
  // Get visible color at position
  for (let i = layers.length-1; i >= 0; i--) {
    if (!layers[i].visible) continue;
    const p = getPixel(layers[i], pos.x, pos.y);
    if (p && p[3] > 0) {
      const hex = '#' + p.slice(0,3).map(v => v.toString(16).padStart(2,'0')).join('');
      currentColor = hex;
      document.getElementById('colorPicker').value = hex;
      renderPalette();
      return;
    }
  }
}

function syncFrame() {
  frames[currentFrame] = cloneLayers(layers);
}

function updateCanvas() {
  renderComposite(layers);
  renderLayers();
  renderFrames();
}

function renderComposite(lyrs) {
  canvas.width = canvasW * scale;
  canvas.height = canvasH * scale;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid
  if (showGrid) {
    ctx.fillStyle = '#2a2a3a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#333350';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= canvasW; x++) { ctx.beginPath(); ctx.moveTo(x*scale,0); ctx.lineTo(x*scale,canvasH*scale); ctx.stroke(); }
    for (let y = 0; y <= canvasH; y++) { ctx.beginPath(); ctx.moveTo(0,y*scale); ctx.lineTo(canvasW*scale,y*scale); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#1a1a28';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Render layers
  const offscreen = document.createElement('canvas');
  offscreen.width = canvasW; offscreen.height = canvasH;
  const octx = offscreen.getContext('2d');

  lyrs.forEach(layer => {
    if (!layer.visible) return;
    const imgData = octx.createImageData(canvasW, canvasH);
    imgData.data.set(layer.data);
    octx.putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(offscreen, 0, 0, canvasW * scale, canvasH * scale);
  });
}

function updateZoomInfo() {
  document.getElementById('zoomInfo').textContent = `${Math.round(scale/20*100)}% | ${canvasW}×${canvasH}`;
}

// Zoom
document.getElementById('canvasArea').addEventListener('wheel', e => {
  e.preventDefault();
  scale = Math.max(4, Math.min(80, scale + (e.deltaY < 0 ? 4 : -4)));
  updateCanvas();
  updateZoomInfo();
});

function toggleGrid() {
  showGrid = !showGrid;
  document.getElementById('gridToggle').classList.toggle('active', showGrid);
  updateCanvas();
}

// Layers
function renderLayers() {
  const list = document.getElementById('layersList');
  list.innerHTML = layers.map((l, i) => {
    const off = document.createElement('canvas');
    off.width = l.w; off.height = l.h;
    const octx = off.getContext('2d');
    const imgData = octx.createImageData(l.w, l.h);
    imgData.data.set(l.data);
    octx.putImageData(imgData, 0, 0);
    const dataUrl = off.toDataURL();
    return `<div class="layer-item${i===currentLayer?' active':''}" onclick="switchLayer(${i})">
      <canvas width="${l.w}" height="${l.h}" style="background-image:url('${dataUrl}')"></canvas>
      <span style="flex:1">Layer ${i+1}</span>
      <span class="layer-vis${l.visible?' visible':''}" onclick="event.stopPropagation();toggleLayerVis(${i})">👁</span>
    </div>`;
  }).join('');
}

function switchLayer(i) {
  currentLayer = i;
  renderLayers();
}

function toggleLayerVis(i) {
  layers[i].visible = !layers[i].visible;
  syncFrame();
  updateCanvas();
}

function addLayer() {
  if (layers.length >= 8) return;
  pushUndo();
  layers.push(initCanvases(canvasW, canvasH));
  currentLayer = layers.length - 1;
  syncFrame();
  updateCanvas();
}

function deleteLayer() {
  if (layers.length <= 1) return;
  pushUndo();
  layers.splice(currentLayer, 1);
  currentLayer = Math.min(currentLayer, layers.length - 1);
  syncFrame();
  updateCanvas();
}

// Frames
function renderFrames() {
  const bar = document.getElementById('framesBar');
  let html = '<span style="font-size:11px;color:var(--text3);margin-right:4px">Frames:</span>';
  frames.forEach((f, i) => {
    // Render thumbnail
    const off = document.createElement('canvas');
    off.width = canvasW; off.height = canvasH;
    const octx = off.getContext('2d');
    const tmp = document.createElement('canvas');
    tmp.width = canvasW; tmp.height = canvasH;
    const tctx = tmp.getContext('2d');
    f.forEach(layer => {
      if (!layer.visible) return;
      const imgData = tctx.createImageData(canvasW, canvasH);
      imgData.data.set(layer.data);
      tctx.putImageData(imgData, 0, 0);
      octx.drawImage(tmp, 0, 0);
    });
    const dataUrl = off.toDataURL();
    html += `<div class="frame-thumb${i===currentFrame?' active':''}" onclick="switchFrame(${i})">
      <canvas width="${canvasW}" height="${canvasH}" style="background-image:url('${dataUrl}')"></canvas>
      <span class="num">${i+1}</span>
    </div>`;
  });
  html += '<button class="btn-frame" onclick="addFrame()" title="Add Frame">+</button>';
  if (frames.length > 1) {
    html += '<button class="btn-frame" onclick="deleteFrame()" title="Delete Frame" style="color:#ff6b6b">−</button>';
    html += '<button class="btn btn-sm" onclick="playAnimation()" style="margin-left:8px">▶ Play</button>';
  }
  bar.innerHTML = html;
}

function switchFrame(i) {
  if (i === currentFrame) return;
  frames[currentFrame] = cloneLayers(layers);
  currentFrame = i;
  layers = cloneLayers(frames[i]);
  renderLayers();
  updateCanvas();
}

function addFrame() {
  if (frames.length >= 20) return;
  frames[currentFrame] = cloneLayers(layers);
  frames.push(cloneLayers(layers));
  currentFrame = frames.length - 1;
  updateCanvas();
}

function deleteFrame() {
  if (frames.length <= 1) return;
  frames.splice(currentFrame, 1);
  currentFrame = Math.min(currentFrame, frames.length - 1);
  layers = cloneLayers(frames[currentFrame]);
  updateCanvas();
}

function playAnimation() {
  let i = 0;
  const fps = 8;
  const interval = setInterval(() => {
    switchFrame(i);
    i = (i + 1) % frames.length;
  }, 1000/fps);
  setTimeout(() => clearInterval(interval), frames.length * 1000/fps);
}

// Resize
function resizeCanvas() {
  const nw = parseInt(document.getElementById('canvasW').value) || 16;
  const nh = parseInt(document.getElementById('canvasH').value) || 16;
  if (nw<4||nw>128||nh<4||nh>128) return;

  pushUndo();
  const oldLayers = cloneLayers(layers);
  canvasW = nw; canvasH = nh;
  layers = oldLayers.map(old => {
    const l = initCanvases(canvasW, canvasH);
    for (let y=0; y<Math.min(old.h, canvasH); y++)
      for (let x=0; x<Math.min(old.w, canvasW); x++)
        setPixel(l, x, y, getPixel(old, x, y) || [0,0,0,0]);
    return l;
  });
  syncFrame();
  updateCanvas();
  updateZoomInfo();
}

// Export
function exportPNG() {
  const off = document.createElement('canvas');
  off.width = canvasW; off.height = canvasH;
  const octx = off.getContext('2d');
  const tmp = document.createElement('canvas');
  tmp.width = canvasW; tmp.height = canvasH;
  const tctx = tmp.getContext('2d');
  layers.forEach(layer => {
    if (!layer.visible) return;
    const imgData = tctx.createImageData(canvasW, canvasH);
    imgData.data.set(layer.data);
    tctx.putImageData(imgData, 0, 0);
    octx.drawImage(tmp, 0, 0);
  });

  // Scale up for export
  const exp = document.createElement('canvas');
  const expScale = Math.max(1, Math.floor(512 / Math.max(canvasW, canvasH)));
  exp.width = canvasW * expScale;
  exp.height = canvasH * expScale;
  const exctx = exp.getContext('2d');
  exctx.imageSmoothingEnabled = false;
  exctx.drawImage(off, 0, 0, exp.width, exp.height);

  const a = document.createElement('a');
  a.href = exp.toDataURL('image/png');
  a.download = `pixelcraft_${canvasW}x${canvasH}.png`;
  a.click();
}

function exportAllFrames() {
  frames.forEach((f, i) => {
    const off = document.createElement('canvas');
    off.width = canvasW; off.height = canvasH;
    const octx = off.getContext('2d');
    const tmp = document.createElement('canvas');
    tmp.width = canvasW; tmp.height = canvasH;
    const tctx = tmp.getContext('2d');
    f.forEach(layer => {
      if (!layer.visible) return;
      const imgData = tctx.createImageData(canvasW, canvasH);
      imgData.data.set(layer.data);
      tctx.putImageData(imgData, 0, 0);
      octx.drawImage(tmp, 0, 0);
    });
    const exp = document.createElement('canvas');
    const expScale = Math.max(1, Math.floor(512 / Math.max(canvasW, canvasH)));
    exp.width = canvasW * expScale;
    exp.height = canvasH * expScale;
    const exctx = exp.getContext('2d');
    exctx.imageSmoothingEnabled = false;
    exctx.drawImage(off, 0, 0, exp.width, exp.height);
    const a = document.createElement('a');
    a.href = exp.toDataURL('image/png');
    a.download = `pixelcraft_frame${i+1}_${canvasW}x${canvasH}.png`;
    a.click();
  });
}

function clearCanvas() {
  if (!confirm('Clear all layers?')) return;
  pushUndo();
  layers = [initCanvases(canvasW, canvasH)];
  currentLayer = 0;
  frames = [cloneLayers(layers)];
  currentFrame = 0;
  updateCanvas();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
  if (e.ctrlKey && e.key === 'g') { e.preventDefault(); toggleGrid(); }
  if (!e.ctrlKey && !e.target.closest('input')) {
    const tools = { p:'pen', e:'eraser', g:'fill', i:'picker', l:'line', r:'rect' };
    if (tools[e.key]) {
      currentTool = tools[e.key];
      document.querySelectorAll('.tool-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tool === currentTool);
      });
    }
  }
});

// Init
init();

</script>
</body>
</html>
