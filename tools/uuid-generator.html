<main style="max-width: 900px; margin-top: 2rem;">
    <h1 class="tool-title" data-i18n="t_uuid">UUID/GUID Generator</h1>
    <p class="tool-desc" data-i18n="d_uuid">Bulk generate secure, unique RFC 4122 compliant version 4 UUID strings.</p>

    <div class="tool-row" style="margin-bottom:1.25rem; align-items: flex-end;">
        <div class="tool-col" style="flex: 1;">
            <label class="tool-label">Number of UUIDs</label>
            <input type="number" class="tool-input" id="uuidCount" value="5" min="1" max="100">
        </div>
        <div class="tool-col" style="flex: 0 0 auto;">
            <button class="btn btn-primary" onclick="generateUUIDs()" style="white-space: nowrap;">Generate UUIDs</button>
        </div>
    </div>

    <label class="tool-label">Generated UUIDs</label>
    <div class="result-container">
        <div class="tool-output" id="uuidOutput" style="min-height:120px; white-space: pre-wrap;">Click "Generate UUIDs" to create...</div>
        <button class="btn btn-secondary copy-btn" onclick="copyText('uuidOutput')" data-i18n="btn_copy">Copy Output</button>
    </div>
</main>

<footer class="footer">

<script>
function generateUUIDs() {
    const count = Math.min(100, Math.max(1, parseInt(document.getElementById('uuidCount').value) || 5));
    let result = '';
    for (let i = 0; i < count; i++) {
        result += crypto.randomUUID() + '\n';
    }
    document.getElementById('uuidOutput').textContent = result.trim();
}
function copyText(id) {
    const el = document.getElementById(id);
    navigator.clipboard.writeText(el.textContent).then(() => {
        const btn = document.querySelector('.copy-btn');
        if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy Output'; }, 1500); }
    });
}
generateUUIDs();
</script>
