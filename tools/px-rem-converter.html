<main style="max-width: 900px; margin-top: 2rem;">
    <h1 class="tool-title" data-i18n="t_px_rem">PX ⇄ REM Converter</h1>
    <p class="tool-desc" data-i18n="d_px_rem">Calculate CSS unit conversions dynamically based on standard 16px roots.</p>

    <div class="tool-row" style="margin-bottom:1.25rem; align-items: flex-end;">
        <div class="tool-col">
            <label class="tool-label">Root Font Size (px)</label>
            <input type="number" class="tool-input" id="pxRemRoot" value="16" min="1" max="100" oninput="calcPxRem()">
        </div>
        <div class="tool-col" style="flex:0 0 auto;">
            <button class="btn btn-primary" onclick="calcPxRem()" style="white-space: nowrap;">Calculate</button>
        </div>
    </div>

    <div class="tool-row" style="margin-bottom:1.25rem;">
        <div class="tool-col">
            <label class="tool-label">PX → REM</label>
            <input type="number" class="tool-input" id="pxInput" placeholder="e.g. 32" oninput="pxToRem()">
            <div class="tool-output" id="pxToRemOut" style="margin-top:0.5rem; min-height:36px;">-</div>
        </div>
        <div class="tool-col">
            <label class="tool-label">REM → PX</label>
            <input type="number" class="tool-input" id="remInput" placeholder="e.g. 2" step="0.1" oninput="remToPx()">
            <div class="tool-output" id="remToPxOut" style="margin-top:0.5rem; min-height:36px;">-</div>
        </div>
    </div>

    <div style="margin-top:1.5rem; padding:1.25rem; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);">
        <h3 style="font-size:0.95rem; margin-bottom:0.75rem; color:var(--text-primary);">Quick Reference (Root = <span id="refRoot">16</span>px)</h3>
        <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:0.5rem; font-size:0.8rem; color:var(--text-secondary); font-family:var(--font-mono);" id="pxRemTable"></div>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 FreeDevTools. All tools run 100% locally in your web browser — absolutely no data is transmitted to any server.</p>
</footer>

<script>
function calcPxRem() {
    const root = parseInt(document.getElementById('pxRemRoot').value) || 16;
    document.getElementById('refRoot').textContent = root;
    pxToRem(); remToPx();
    buildTable(root);
}
function pxToRem() {
    const root = parseInt(document.getElementById('pxRemRoot').value) || 16;
    const px = parseFloat(document.getElementById('pxInput').value);
    document.getElementById('pxToRemOut').textContent = isNaN(px) ? '-' : (px / root).toFixed(4) + 'rem';
}
function remToPx() {
    const root = parseInt(document.getElementById('pxRemRoot').value) || 16;
    const rem = parseFloat(document.getElementById('remInput').value);
    document.getElementById('remToPxOut').textContent = isNaN(rem) ? '-' : Math.round(rem * root) + 'px';
}
function buildTable(root) {
    const sizes = [0,1,2,4,8,12,16,20,24,32,40,48,64];
    const container = document.getElementById('pxRemTable');
    let html = '<div style="font-weight:600;color:var(--text-primary);">PX</div><div style="font-weight:600;color:var(--text-primary);">REM</div>';
    sizes.forEach(s => {
        html += '<div>' + s + 'px</div><div>' + (s / root).toFixed(4) + 'rem</div>';
    });
    container.innerHTML = html;
}
calcPxRem();
</script>
